<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2f6b3a">
<title>천연물분과 심포지엄 초록집</title>
<style>
:root{
  --bg:#f4f7f2; --card:#ffffff; --ink:#1c2a1d; --muted:#5b6b5c; --line:#dbe5d8;
  --g:#2f6b3a; --g2:#e4efe2; --g3:#4f8f5a; --accent:#b7791f; --mark:#fde68a;
  --chip:#eef4ec; --shadow:0 1px 3px rgba(20,40,20,.08);
  --fs:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121813; --card:#1b231c; --ink:#e3ebe2; --muted:#9aab9b; --line:#2c392d;
    --g:#7fc08a; --g2:#22331f; --g3:#9fd3a8; --accent:#e6b45a; --mark:#5c4a12; --chip:#223024; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121813; --card:#1b231c; --ink:#e3ebe2; --muted:#9aab9b; --line:#2c392d;
  --g:#7fc08a; --g2:#22331f; --g3:#9fd3a8; --accent:#e6b45a; --mark:#5c4a12; --chip:#223024; --shadow:none;
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--g)}
button{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
svg{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 머리 */
.hero{background:linear-gradient(135deg,#24552d,#3f8a4c);color:#fff;padding:22px 0 18px}
.hero .ey{font-size:.8rem;opacity:.85;letter-spacing:.02em}
.hero h1{margin:4px 0 6px;font-size:1.45rem;line-height:1.3}
.hero .th{font-size:1rem;font-weight:600;opacity:.95}
.hero .meta{font-size:.85rem;opacity:.9;margin-top:6px}
.hero .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hero .links a{color:#fff;text-decoration:none;font-size:.85rem;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.12)}

/* 검색 바 */
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.search:focus-within{border-color:var(--g)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:1rem;padding:11px 0;min-width:0}
.search .clr{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0f1a10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0f1a10}}
.tools{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:.82rem;color:var(--muted);padding-top:6px}
.tools .r{display:flex;gap:4px}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:.82rem;min-height:32px}

/* 홈 */
section.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
section.blk h2{font-size:1.05rem;margin:0 0 10px;color:var(--g)}
.kv{display:grid;grid-template-columns:5.2em 1fr;gap:4px 10px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.day{margin-top:8px}
.day h3{font-size:.95rem;margin:12px 0 6px;display:flex;gap:8px;align-items:baseline}
.day h3 small{color:var(--muted);font-weight:500}
.prow{display:grid;grid-template-columns:6.6em 1fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:.9rem}
.prow .t{color:var(--muted);font-variant-numeric:tabular-nums}
.prow .k{font-weight:700;font-size:.82rem;color:var(--g3)}
.prow .it{display:block;padding:3px 0;text-decoration:none;color:var(--ink)}
.prow .it b{color:var(--g)}
.prow .it span{color:var(--muted);font-size:.85rem}
details.greet summary{cursor:pointer;color:var(--g);font-weight:700}
details.greet p{font-size:.92rem;margin:.6em 0}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}

/* 카드 */
.count{font-size:.85rem;color:var(--muted);margin:14px 2px 6px}
.grp{font-size:.9rem;font-weight:800;color:var(--g);margin:18px 2px 6px;display:flex;gap:8px;align-items:baseline}
.grp small{color:var(--muted);font-weight:500}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;box-shadow:var(--shadow);scroll-margin-top:150px}
article .hd{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 14px 12px;cursor:pointer}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.id{font-weight:800;color:#fff;background:var(--g);border-radius:6px;padding:1px 7px;font-size:.78rem}
:root[data-theme="dark"] .id{color:#0f1a10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .id{color:#0f1a10}}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ttl{font-size:1.02rem;font-weight:700;line-height:1.4;margin:6px 0 4px}
.who{font-size:.86rem;color:var(--muted)}
.star{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;min-width:36px;min-height:32px}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.bd{padding:0 14px 14px;border-top:1px solid var(--line);display:none}
article.open .bd{display:block}
.bd h4{font-size:.8rem;color:var(--muted);margin:14px 0 4px;font-weight:700}
.auth{font-size:.92rem}
.aff{font-size:.82rem;color:var(--muted);margin:2px 0;padding-left:0;list-style:none}
.aff li{margin:2px 0}
.abs p{margin:.55em 0;font-size:.96rem;line-height:1.72}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{border:0;background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.bio{background:var(--g2);border-radius:10px;padding:10px 12px;font-size:.86rem}
.bio div{margin:3px 0} .bio b{color:var(--g)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:.86rem;cursor:pointer;text-decoration:none;color:var(--ink);min-height:40px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* 원본 쪽 보기 */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;flex-direction:column}
.lb.on{display:flex}
.lb .lbh{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:10px 16px;font-size:.9rem}
.lb .lbh button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
.lb .sc{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center;padding:0 8px 16px}
.lb img{max-width:min(100%,900px);height:auto;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2a1d;color:#fff;padding:10px 16px;border-radius:10px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:24px 16px 40px}
.top-btn{position:fixed;right:16px;bottom:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;display:none;z-index:20}
.top-btn.on{display:block}
@media (max-width:480px){ .prow{grid-template-columns:1fr;gap:2px} .prow .t{font-size:.82rem} }
@media (min-width:720px){ .hero h1{font-size:1.75rem} .ttl{font-size:1.08rem} }
@media print{ .bar,.hero .links,.acts,.star,.top-btn{display:none!important} article .bd{display:block!important} article{break-inside:avoid} }
</style>
</head>

<script>
var DATA = {"entries":[{"title":"Emerging Trends in Metabolomics and Spatial Molecular Analysis Using Advanced Mass Spectrometry","affiliations":["Waters Korea, Gwangmyeong, Republic of Korea"],"abstract":["Recent advances in mass spectrometry have expanded its applications in metabolomics and spatial molecular analysis. High-resolution mass spectrometry (HRMS) enables accurate mass measurement and molecular identification, while ion mobility provides additional separation and structural information for complex molecules. In addition, desorption electrospray ionization mass spectrometry imaging (DESI-MSI) enables direct visualization of the spatial distribution of metabolites and lipids in biological samples with minimal sample preparation. This presentation introduces recent analytical approaches using HRMS, ion mobility, and DESI-MSI, with applications in metabolomics, natural product research, and spatial molecular analysis."],"keywords":"Metabolomics, High-resolution mass spectrometry, Ion mobility, DESI-MSI, Spatial molecular analysis","ack":"","bio":{"position":"Waters Korea ANR (Academic & Research) Team Leader","sections":[{"h":"주요 경력","text":"Waters Korea Academic & Research 팀장 질량분석 및 분석과학 분야의 연구· 응용 및 산학협력 활동"},{"h":"전문 분야","text":"고분해능 질량분석(HRMS), 대사체학 (Metabolomics), 이온 모빌리티(Ion Mobility), 질량분석 이미징(MSI) 및 천연물 분석"},{"h":"학회 활동","text":"질량분석이미징연구회 산학이사 및 창립 핵심위원 아시아 질량분석이미징(MSI) 커뮤니티 핵심 멤버 대한화학회 산학협력 이사 (2026– 현재) 한국단백체학회(KHUPO) 산학협력 이사 (2023–현재)"},{"h":"주요 수상","text":"한국분석과학회 분석기술상 (2025) Waters Asia Sales Award (2024)"}]},"id":"T-1","type":"oral","kind":"tech","session":"기술강연","day":"10.15(목)","time":"09:30–10:10","speaker":"김현우 이사","org":"Waters","program_title":"Waters 솔루션을 활용한 최신 연구 동향","page":12,"printed":10,"authors":["Hyunwoo Kim"],"alias":"워터스"},{"title":"복잡한 천연물 시료의 성분 해석을 위한 LC-HRMS 분석 워크플로와 산업적 활용 사례","affiliations":["1 Waters Korea, Gwangmyeong, Republic of Korea"],"abstract":["천연물 시료는 다양한 화합물이 복잡한 매트릭스 내에 존재하기 때문에, 주요 성분의 확인뿐만 아니라 미지 성분의 탐색 및 구조적 특성 규명을 위해 종합적인 분석 전략이 요구됩니다. 특히 최근 천연물 연구는 단순한 지표성분 분석을 넘어 전체 성분 프로파일링, 기능성 물질 발굴 및 원료의 품질관리로 확대되고 있으며, 이에 따라 액체크로마토그래피-고분해능 질량분석법(LC-HRMS)을 활용한 비표적 분석의 중요성이 더욱 증가하고 있습니다. 본 발표에서는 복잡한 천연물 시료의 성분 해석을 위한 LC-HRMS 기반 분석 워크플로를 소개합니다. 시료 전처리 및 액체크로마토그래피 분리부터 고분해능 MS 및 MS/MS 데이터 획득, 정확질량을 이용한 분자식 추론, MS/MS fragmentation 정보를 기반으로 한 구조 정보 확보, 데이터베이스 및 스펙트럼 라이브러리를 활용한 화합물 동정에 이르는 전반적인 분석 과정을 다룹니다. 또한 복잡한 시료에서 다수의 화합물 정보를 효율적으로 추출하고 시료 간 성분 차이를 비교하기 위한 데이터 처리 및 해석 전략을 소개합니다. 아울러 천연물 원료 및 제품의 성분 프로파일링, 품질관리, 기능성 소재 발굴 및 표준화 등 산업 현장에서 LC-HRMS가 활용되는 사례를 소개합니다. 다양한 천연물 시료의 분석 사례를 바탕으로 복잡한 시료에서 확보한 화학적 정보를 종합적으로 해석하고, 이를 유효성분 및 품질지표 탐색과 같은 산업적 활용으로 연결하는 분석 접근법을 제시합니다. 이를 통해 LC-HRMS 기반 분석이 천연물 연구의 탐색적 분석을 넘어 소재 개발 및 품질관리 등 실제 산업적 응용 분야에서도 활용될 수 있는 가능성을 제시합니다."],"keywords":"천연물, LC-HRMS, 비표적 분석, 성분 프로파일링, 고분해능 질량분석","ack":"","bio":{"position":"Waters Korea HRMS Market Development Team Leader","sections":[{"h":"학력","text":"University of Maryland, College Park 화학 학사 (2010) George Mason University 화학 석사 (2012) University of Maryland, College Park 화학/분석화학 박사 (2021) 경력 Waters Korea HRMS Market Development Team Leader (2025–현재) Shimadzu MS Technical Support Scientist (2024–2025) AB Sciex Biologics Workflow Specialist (2023–2024) AstraZeneca Senior Scientist (2022–2023) Bruker Daltonics Field Application Scientist (2021– 2022)"},{"h":"전문 분야","text":"LC-MS, 고분해능 질량분석(HRMS), 단백질 특성분석, 프로테오믹스, 펩타이드체학, 대사체학, CE-MS, 바이오의약품 분석"},{"h":"주요 수상","text":"Glen E. Gordon Memorial Award (2020) US HUPO Student Travel Award (2017)"}]},"id":"T-2","type":"oral","kind":"tech","session":"기술강연","day":"10.15(목)","time":"10:10–11:00","speaker":"최사무엘 부장","org":"Waters","program_title":"복잡한 천연물 시료의 성분 해석을 위한 LC-HRMS 분석 워크플로와 산업적 활용 사례","page":13,"printed":11,"authors":["Sam Choi"],"alias":"워터스"},{"title":"MaxPeak Premier Microflow 컬럼으로 높이는 LC-MS 감도와 지속가능성","affiliations":["Waters Korea"],"abstract":["LC-MS 기반 정량 바이오분석, 신약 개발, 오믹스 연구에서는 감도를 더 높이는 동시에 귀한 시료와 용매를 아끼는 방법이 필요합니다. 마이크로플로우(1.0 mm ID, 0.3mm ID) LC는 이런 nslating these developments into marketable products requires early integration of regulatory requirements, ingredient characterization, and scientific evidence of safety. This research reviews international regulatory trends for emerging food technologies and outlines relevant pathways administered by the Ministry of Food and Drug Safety (MFDS) in the Republic of Korea. Particular attention is given to the temporary recognition of standards and specifications for new food ingredients and the individual recognition of functional ingredients for health functional foods. The regulatory process is discussed from ingredient classification and dossier preparation to scientific review, responses to requests for additional information, and recognition. Key development considerations include source identification, history of food use, manufacturing controls, compositional characterization, specifications, validated analytical methods, stability, and batch consistency. For botanical ingredients, species authentication, plant parts used, extraction conditions, and standardization of functional or marker constituents are emphasized. For cell-based foods, assessment focuses on cell sources and characteristics, culture media, scaffolds where used, and potential process-related residues. For precision fermentation-derived ingredients, production strain characterization, genetic modifications where applicable, purification, and residual microbial components are addressed. Safety assessment approaches encompass hazard identification, dietary exposure estimation, nutritional assessment, allergenicity evaluation, and toxicological testing appropriate to the ingredient and applicable requirements. For health functional food development, additional emphasis is placed on substantiating the proposed physiological benefits through well-designed human intervention studies, supported by mechanistic evidence, and establishing appropriate daily intake levels and conditions of use. Integrating these considerations throughout research and development can improve the quality of regulatory submissions and support the development of safe, scientifically substantiated food ingredients."],"keywords":"cell-based foods, precision fermentation, food ingredient regulation, safety assessment","ack":"","bio":{"position":"식품의약품안전처 식품기준과","sections":[{"h":"학력","text":"Master's degree in food engineering, Chungbuk National University Doctor's degree in food engineering, Chungbuk National University Master's degree, Chungnam National University Patent Law School 자격 Food technician Fishery product manufacturing technician Distribution manager Agricultural product quality manager, etc. 경력 Scientific Officer, Food Standard Division, Ministry of Food and Drug Safety (현재) Researcher, National Institute of Crop Science, National Institute of Horticultural and Herbal Science Professional Researcher, Functional Food Department, National Institute of Agricultural Sciences Instructor of Food Engineering, Chungbuk Provincial University, Kyungpook National University Ministry of Food and Drug Safety Dietary and Nutritional Safety Policy and Policy Research Institute Health Researcher, Nutritional Function Research Department, Korea Food and Drug Safety Evaluation Institute Adjunct Professor, Korea University Sejong Campus"}]},"id":"I-3","type":"oral","kind":"invited","session":"초청강연 Ⅱ · 연구성과의 산업화","day":"10.15(목)","time":"15:30–16:00","speaker":"이미영 주무관","org":"식품의약품안전처","program_title":"천연물 소재의 식품 산업화: 제도 활용과 시장진입 전략","page":17,"printed":15,"authors":["Mi-Young Lee"],"alias":"식품의약품안전처 식약처"},{"title":"Individual Recognition and Commercialization Strategy for Health Functional Food Ingredients: A Case Study of Wasabi Leaf Extract","affiliations":["Nutracore Co., Ltd., Suwon 16514, Republic of Korea"],"abstract":["The commercialization of natural materials requires an integrated development strategy that goes beyond efficacy screening. It must include verification of raw material origin, selection of marker compounds, standardization of manufacturing processes, safety evaluation, preclinical and human studies, individual recognition by the Ministry of Food and Drug Safety (MFDS), and product development strategy. Nutracore has established a one-stop development platform that connects natural material research, raw material standardization, analytical method development and validation, clinical research organization (CRO) services, regulatory consulting, and GMP manufacturing to support the commercialization of health functional food ingredients.","In this presentation, we introduce the development and commercialization strategy of a natural health functional food ingredient, focusing on wasabi leaf extract. Wasabi leaf extract is prepared from the leaves of Wasabia japonica (Miq.) Matsum., and isovitexin was selected as the marker compound. During development, the food-use history and domestic/international use information of the raw material were reviewed, and the extraction and manufacturing processes were standardized based on marker compound content and manufacturing yield. In addition, product specifications, HPLC-based analytical method validation, and safety-related data were established to support the MFDS individual recognition application. To evaluate functionality, a preclinical study was conducted using a high-fat diet-induced obese ICR mouse model. Body weight, body fat mass, abdominal fat mass, blood lipid levels, and markers related to lipid synthesis and metabolism were assessed. Subsequently, a human study was conducted in Korean adults with a BMI of 25–32 kg/m² to evaluate the effects of 250 mg/day of wasabi leaf extract for 12 weeks. The study showed improvements in major body composition parameters, including body fat mass, body fat percentage, body weight, and BMI.","Based on these research data, wasabi leaf extract was developed as an individually recognized health functional food ingredient for body fat reduction and was further commercialized through finished product development and distribution channel application. In addition, other Nutracore-developed individually recognized health functional food ingredients, such as corn silk and lemon balm extract complex, have also been applied to commercial products and reported in official production performance data."],"keywords":"natural materials, individually recognized health functional food ingredient, wasabi leaf extract, raw material standardization, human study, commercialization","ack":"","bio":{"position":"㈜뉴트라코어 대표이사","sections":[{"h":"학력","text":"단국대학교 미생물학과 이학사 (1999) 단국대학교 미생물학과 이학석사 (2001) 성균관대학교 식품생명공학 이학박사 (2021)"},{"h":"주요 이력","text":"㈜뉴트라코어 대표이사 (2018–현재) 농기평 심의위원 (2022–현재) 건강기능식품협회 기술분과위원 (2015–2018) ㈜에이치엘사이언스 연구소장 (2012–2018) 서울대학교 지능형생체계면공학연구센터 연구원 (2002–2003)"},{"h":"전문 분야","text":"천연물 기능성 원료 개발, 건강기능식품 개별인정, 원료 표준화, 인체적용시험, 식약처 인허가, GMP 생산 연계 주요 실적 건강기능식품 기능성 원료 개발 및 식약처 개별인정 업무 20년 이상 수행 — 헛개과병추출물, 석류농축액, 옥수수수염·레몬밤추출복합물, 와사비잎추출물 등 다수의 개별인정 원료 개발 천연물 소재의 지표성분 설정, 기준규격 확립, 비임상시험, 인체적용시험, 식약처 인허가 및 사업화 전략 수립 와사비잎추출물, 옥수수수염· 레몬밤추출복합물, 석류, 레몬밤, 민들레 등 천연물 기능성 소재 관련 논문 약 30편 ㈜뉴트라코어에서 연구개발부터 원료 표준화, 효능평가, CRO, 식약처 인허가, GMP 생산까지 전 과정 총괄"}]},"id":"I-4","type":"oral","kind":"invited","session":"초청강연 Ⅱ · 연구성과의 산업화","day":"10.15(목)","time":"16:00–16:30","speaker":"최범락 대표","org":"㈜뉴트라코어","program_title":"천연물 분야 기술 사업화(기술이전) 전략 및 사례","page":18,"printed":16,"authors":["Beom Rak Choi"],"alias":"뉴트라코어"},{"title":"천연물 소재의 산업화를 위한 Scale-up 전략: 산삼 배양근 대량생산 사례","affiliations":["1 충북대학교 농업생명환경대학 원예과학과, 청주, 28644, 대한민국","2 CHRIST University, 인도,","3 (주)웰그린, 대한민국"],"abstract":["식물 생명공학과 천연물 연구의 융합은 약용작물을 고부가가치 기능성 소재 생산을 위한 지속 가능한 바이오 팩토리로 활용할 수 있는 혁신적인 기회를 제공한다. 특히 식물 세포, 조직 및 기관 배양 플랫폼은 기존 농업 재배 방식의 원료 수급 불확실성과 환경적 제약을 극복하는 동시에, 식품 및 의약품 산업에서 요구하는 원료의 균일성과 안전성을 효과적으로 확보할 수 있게 한다. 본 연구에서는 희귀한 자연산 산삼(Panax ginseng) 으로부터 세포 분화 유도 기법을 활용하여 안정적으로 관리 가능한 세포주 및 부정근 라인을 구축하였다. 아울러 이차대사산물의 생합성 및 축적을 극대화하기 위해 유도처리 (elicitation) 기법이 적용된 생물반응기 시스템을 최적화하였다. 대사체 프로파일링 분석 결과, 구축된 산삼 배양근에서는 일반 재배 인삼에서는 드물게 검출되는 다양한 미량 진세노사이드가 축적되었으며, 이를 바탕으로 신규 생리활성 화합물의 분리 및 구조적 특이성을 규명하였다. 나아가 10톤 규모의 산업용 파일럿 생물반응기를 통한 Scale-up 공정을 성공적으로 달성하여 8주 배양 주기에 1000 kg/ton의 수율을 확보하였다. 특히 150년근 산삼 유래 배양근으로부터 세포 재프로그래밍을 통해 체세포배를 성공적으로 유도함으로써, 희귀 유전자원의 장기 보존과 대량 증식을 위한 견고한 기틀을 마련하였다. 종합하여 볼 때, 본 연구에서 제시한 통합적 접근법은 산삼 배양근 연구의 지속 가능성과 안전성을 높이고, 다양한 산업적 응용을 실현하기 위한 미래지향적 패러다임을 제시한다."],"keywords":"산삼, 배양근, 진세노사이드, 생물반응기","ack":"본 연구는 농촌진흥청 식물세포기반 고부가 기능성소재 대량생산 원천기술 개발 사업(RS-2026-25512707)의 지원에 의해 이루어진것임.","bio":{"position":"충북대학교 농업생명환경대학 원예과학과 교수","sections":[{"h":"학력","text":"부산대학교 이학사 (1993) 충북대학교 원예학 농학석사 (1997) 충북대학교 원예학 농학박사 (2002) 경력 충북농업기술원 농업연구사 (1993– 1998) 국립산림과학원 임업연구사 (2003– 2012) University of British Columbia (캐나다) Visiting Scientist (2007– 2009) 충북대학교 원예과학과 교수 (2012– 현재) 주요 활동 한국화훼학회 부회장 (2021–현재) 한국식물생명공학회 부회장 (2022– 2024) Plant Cell, Tissue and Organ Culture 편집위원 (2020–현재) 국제원예학회(ISHS) Working Group Chair (2018–2022)"}]},"id":"I-5","type":"oral","kind":"invited","session":"초청강연 Ⅱ · 연구성과의 산업화","day":"10.15(목)","time":"16:30–17:00","speaker":"박소영 교수","org":"충북대학교","program_title":"천연물 소재의 산업화를 위한 Scale-up 전략: 산삼 배양근 대량생산 사례","page":19,"printed":17,"authors":["박소영","이한솔","이인영","H.N. Murthy","이효신","권수정","권아름","백기엽"],"alias":""},{"title":"Khellactone-Type Coumarins from Peucedanum japonicum: Isolation, Neuroinflammation-Related Screening, and Network Pharmacology","affiliations":["1 BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea","2 Research Institute of Pharmaceutical Sciences, College of Pharmacy, Chosun University, Gwangju 61452, Republic of Korea"],"abstract":["Phytochemical investigation of Peucedanum japonicum aerial parts was conducted to characterize khellactone constituents and evaluate candidate molecular targets for neuroinflammation. Chromatographic separation of the ethyl acetate fraction led to the identification of eighteen khellactone-type dihydropyranocoumarins (1–18). Their chemical structures and absolute configurations were elucidated using 1D/2D NMR, high-resolution UPLC-QTOF-MSE fragmentation, and electronic circular dichroism (ECD) analysis, confirming a common (3′S,4′S) configuration. Network pharmacology identified 72 predicted targets common to the compounds, 50 of which overlapped with neuroinflammation-associated targets. Protein–protein interaction analysis identified six hub genes: STAT3, BCL2, HIF1A, GSK3B, PPARA, and MMP9. Molecular docking predicted a favorable interaction between compound 13 and PPARA. In BV2 microglial cells, several isolates inhibited lipopolysaccharide-induced nitric oxide production, with IC₅₀ values of 5.5–6.8 μM. No clear protective effects were observed in HT22 cells.","These findings characterize the khellactone constituents of P. japonicum and identify compounds with potential anti-neuroinflammatory activity. The predicted molecular targets require experimental validation."],"keywords":"Peucedanum japonicum, Khellactones, Network pharmacology, Molecular docking, Anti-neuroinflammatory","ack":"","id":"S-1","type":"oral","kind":"student","session":"학생 구두발표","day":"10.16(금)","time":"10:00–11:00","speaker":"박정현","org":"경북대학교","page":20,"printed":18,"authors":["Jeong Hyun Park","Woo-Cheol Shin","Jin-Kyu Jang","Hyeon Seon Na","Yong Jae Jeong","Dong-Sung Lee","Dae Young Lee"],"alias":"경북대학교 경북대 조선대학교 조선대"},{"title":"Comparative Metabolomic Analysis of Vitex rotundifolia L. f. Across Plant Parts and Geographic Locations in Jeju Island and Its Association with Environmental Characteristics","affiliations":["1 Natural Product Research Center, Korea Research Institute of Bioscience and Biotechnology KRIBB, 30-Yeongudanji-ro, Ochang-eup, Cheongwon-gu, Cheongju-si, Chungbuk, 28116, Republic of Korea","2 Department of Plant Biotechnology, College of Life Sciences and Biotechnology, Korea University, 145-Anam-ro, Seongbuk- gu, Seoul, 02841, Republic of Korea","3 Biodiversity Research Institute, Clean Bio Business Division, JejuTechnopark, 338, Sinryedong-ro, Namwon-eup, Seogwipo- si, Jeju-do, 63608, Republic of Korea"],"abstract":["Vitex rotundifolia L. f. is a coastal halophyte belonging to the Verbenaceae family and is widely distributed across coastal regions of Korea, including Jeju Island, as well as in China, Japan, Southeast Asia, and Australia. Its seeds have long been used for medicinal purposes, and the plant is known to contain various secondary metabolites, including iridoids, flavonoids, phenolic compounds, and diterpenoids. The composition and accumulation of these secondary metabolites can vary depending on biotic and abiotic factors. Therefore, this study compared the metabolite profiles of V. rotundifolia across different geographic locations and plant parts on Jeju Island to identify useful metabolites for raw material standardization and to elucidate their relationships with environmental characteristics. Samples were collected from ten locations on Jeju Island, and the metabolite profiles of leaves, stems, immature seeds, and mature seeds were analyzed using UPLC-QTOF/MS. Multivariate statistical analysis was performed to evaluate differences in metabolite composition among plant parts and to identify key compounds contributing to these variations. Based on the analytical results and their potential utility, two major iridoid compounds were selected as key chemical markers for raw material standardization. Comparison of their contents across collection sites revealed regional differences in the relative abundance of these two compounds. These findings provide fundamental data for evaluating the relationships between biotic and abiotic factors and key metabolites, and for establishing raw material standardization criteria to support the industrial utilization of V. rotundifolia."],"keywords":"Vitex rotundifolia L. f., Iridoids, Metabolomics, Geographic variation, Soil characteristics","ack":"","id":"S-2","type":"oral","kind":"student","session":"학생 구두발표","day":"10.16(금)","time":"10:00–11:00","speaker":"유슬범","org":"한국생명공학연구원","page":21,"printed":19,"authors":["Seul Beom Yu","Hyoung-Geun Kim","Hangyeol Lee","Doo-Young Kim","In Soo Suh","Sung Chun Kim","Sei-Ryang Oh","Dongho Lee","Hyung Won Ryu"],"alias":"고려대학교 고려대 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Comparative Micromorphology of Adhesive and Aerial Roots and Metabolite Profiles across Species and Organs in Climbing Plants","affiliations":["1 Ecological Technology Research Team, Division of Restoration Ecology Research, National Institute of Ecology, Seocheon 33657 Republic of Korea"],"abstract":["Some climbing plants have adhesive roots or aerial roots, specialized organs responsible for attachment. Because of this adhesive function, the attachment mechanisms and adhesive substances of these organs have attracted considerable attention in the field of biomimicry. Although adhesive roots are found in a range of climbing plant species, previous studies in this area have focused predominantly on the adhesive roots of Hedera helix. Therefore, this study aimed to examine interspecific differences in the morphology of adhesive and aerial roots and to compare metabolite profiles across species and organs. The micromorphological characteristics of these roots and metabolite profiles across species and organs were compared in H. helix, Trachelospermum asiaticum, and Epipremnum aureum using high-resolution stereomicroscopy, LV-SEM, and LC-MS/MS. The results showed that although the adhesive roots of H. helix and T. asiaticum differed in morphology, irregular hair-like microstructures were observed in both species. In E. aureum, elongating aerial roots showed a relatively regular microstructure. Metabolite profiling revealed differences across species and organs, with differences among species more evident than those among organs. These findings suggest interspecific variation in the micromorphology of adhesive and aerial roots, as well as variation in metabolite profiles across species and organs. They may contribute to a broader understanding of attachment traits in climbing plants and provide a basis for the future development of bio-derived adhesive materials and biomimetic technologies inspired by plant attachment traits."],"keywords":"climbing plant, adhesive root, micromorphology, metabolomics, biomimicry","ack":"","id":"S-3","type":"oral","kind":"student","session":"학생 구두발표","day":"10.16(금)","time":"10:00–11:00","speaker":"백신유","org":"국립생태원","page":22,"printed":20,"authors":["Shin-yu Baek","Haejin Bae"],"alias":"국립생태원"},{"title":"Lancemaside A isolated from Codonopsis lanceolata ameliorates inflammation-induced intestinal barrier dysfunction","affiliations":["1 Department of Biological Sciences, Kangwon National University, Gangneung 25457, Republic of Korea","2 Department of Biomedical and Pharmaceutical Sciences, Graduate School, Kyung Hee University, Seoul 02447, Republic of Korea"],"abstract":["Codonopsis lanceolata is an edible plant traditionally consumed as both a food and herbal medicine, yet the biological activities of its aerial parts remain largely unexplored. Compounds isolated from the aerial parts were screened for anti-inflammatory activity, with Lancemaside A showing the strongest activity among the tested compounds. Lancemaside A reduced inflammatory responses in intestinal epithelial cells and improved barrier integrity, as shown by increased transepithelial electrical resistance (TEER), decreased paracellular permeability, and recovery of tight junction protein expression. Transcriptomic analysis showed changes in pathways related to epithelial barrier function and antioxidant responses, along with increased expression of tight junction- and Nrf2-associated genes. ARE-luciferase and protein expression analyses further showed that Lancemaside A activates Nrf2-associated signaling. These results suggest that Lancemaside A is an active constituent of C. lanceolata aerial parts with intestinal barrier-protective properties and potential as a food-derived functional ingredient for intestinal health."],"keywords":"Codonopsis lanceolata, lancemaside A, inflammation, intestinal barrier, tight junction, Nrf2","ack":"","id":"S-4","type":"oral","kind":"student","session":"학생 구두발표","day":"10.16(금)","time":"10:00–11:00","speaker":"정현정","org":"강원대학교","page":23,"printed":21,"authors":["Hyeon-Jeong Jeong","So-Ri Son","Dae Sik Jang","Hyun Bong Park"],"alias":"강원대학교 강원대 경희대학교 경희대"},{"title":"Lancemaside A isolated from Codonopsis lanceolata ameliorates inflammation-induced intestinal barrier dysfunction","affiliations":["1 Department of Biological Sciences, Kangwon National University, Gangneung 25457, Republic of Korea","2 Department of Biomedical and Pharmaceutical Sciences, Graduate School, Kyung Hee University, Seoul 02447, Republic of Korea"],"abstract":["Codonopsis lanceolata is an edible plant traditionally consumed as both a food and herbal medicine, yet the biological activities of its aerial parts remain largely unexplored. Compounds isolated from the aerial parts were screened for anti-inflammatory activity, with Lancemaside A showing the strongest activity among the tested compounds. Lancemaside A reduced inflammatory responses in intestinal epithelial cells and improved barrier integrity, as shown by increased transepithelial electrical resistance (TEER), decreased paracellular permeability, and recovery of tight junction protein expression. Transcriptomic analysis showed changes in pathways related to epithelial barrier function and antioxidant responses, along with increased expression of tight junction- and Nrf2-associated genes. ARE-luciferase and protein expression analyses further showed that Lancemaside A activates Nrf2-associated signaling. These results suggest that Lancemaside A is an active constituent of C. lanceolata aerial parts with intestinal barrier-protective properties and potential as a food-derived functional ingredient for intestinal health."],"keywords":"Codonopsis lanceolata, lancemaside A, inflammation, intestinal barrier, tight junction, Nrf2","ack":"","authors":["Hyeon-Jeong Jeong","So-Ri Son","Dae Sik Jang","Hyun Bong Park"],"id":"P-01","type":"poster","session":"포스터","page":30,"printed":28,"has_figure":false,"alias":"강원대학교 강원대 경희대학교 경희대"},{"title":"Standardization and Biological Activity Screening of Cakile edentula (Bigelow) Hook. Leaf Extract","affiliations":["1 Department of Biological Sciences, College of Natural Sciences, Kangwon National University, Gangneung, 25457, Republic of Korea"],"abstract":["Natural products have gained increasing attention as important sources of bioactive compounds for disease prevention and therapeutic applications. However, the biological activity and phytochemical composition of Cakile edentula, a halophytic plant inhabiting coastal dunes, remain largely unexplored. In this study, we evaluated the antioxidant and anti-inflammatory properties of C. edentula leaf extract and investigated its potential to modulate therapy-induced senescence (TIS) in cancer cells. The extract exhibited free radical scavenging activity and suppressed inflammatory responses by reducing nitric oxide production and the expression of pro-inflammatory cytokines. Given that oxidative stress and inflammatory signaling are key drivers of TIS, we hypothesized that the extract may influence this process. To test this, a doxorubicin-induced senescence model was established. C. edentula extract significantly reduced senescence-associated β-galactosidase (SA-β-gal) activity and decreased p21 expression, indicating attenuation of senescence-associated phenotypes. Importantly, the extract markedly suppressed the expression of senescence-associated secretory phenotype (SASP) factors, including IL-6, IL-8, and TGF-β, suggesting that it modulates the inflammatory and pathological features of TIS rather than simply inhibiting senescence itself. Furthermore, phytochemical analysis identified various bioactive compounds, including flavonoids and fatty acid derivatives, and characterized the structures of nine major constituents. A marker compound was selected and quantitatively analyzed, supporting the feasibility of extract standardization. Collectively, these findings demonstrate that C. edentula leaf extract attenuates the pathological features of therapy-induced senescence through its antioxidant and anti-inflammatory activities. These results highlight its potential as a functional natural resource for modulating cancer-associated senescence and support its further development for therapeutic applications."],"keywords":"Natural Products, Phytochemicals, Cakile edentula (Bigelow) Hook., Brassicaceae, Standardization, Flavonoids, Antioxidant, Anti-inflammation","ack":"","authors":["Jun Seok Wang","Chul Woong Ho","Hyeon-Jeong Jeong","Ye Jin Kim","Aram Kim","Kyung-Won Min","Hyun Bong Park"],"id":"P-02","type":"poster","session":"포스터","page":31,"printed":29,"has_figure":false,"alias":"강원대학교 강원대"},{"title":"Bioactive potential of Codium fragile ethanol extract for industrial application as a natural material targeting itch-associated inflammation","affiliations":["1 Department of Oral Physiology, College of Dentistry, Chosun University, Gwangju 61452, Republic of Korea","2 Department of Biomaterials Development Research, L&K Co., Ltd, Gwangju, 61436, Republic of Korea"],"abstract":["Marine-derived natural products have attracted increasing attention as sustainable sources of bioactive compounds with potential applications in functional foods, cosmetics, and related industries. Codium fragile (C. fragile), an edible green macroalga widely distributed in coastal regions of East Asia, has been reported to exhibit various biological activities, including antioxidant, anti-inflammatory, immunomodulatory, and skin-protective effects. However, its potential activity against itch-associated mast cell responses and the integrated regulation of inflammation and epidermal responses has not been fully characterized.","In this study, we investigated the potential itch-relieving and anti-inflammatory effects of a 70% ethanol extract of C. fragile (CF70E) using RBL-2H3 mast cells, RAW264.7 macrophages, and HaCaT keratinocytes. CF70E showed no significant cytotoxicity at the tested concentrations. In stimulated RBL-2H3 cells, CF70E significantly inhibited β-hexosaminidase release and reduced TNF-α and IL-6 production. These effects were accompanied by suppression of Syk and PLCγ1 phosphorylation, indicating attenuation of mast cell activation and degranulation-related signaling. In LPS-stimulated RAW264.7 macrophages, CF70E reduced nitric oxide, prostaglandin E2, TNF-α, and IL-6 production, together with decreased expression of iNOS and COX-2. In stimulated HaCaT keratinocytes, CF70E decreased the expression of inflammatory mediators, including MDC, TARC, and IL-1β, while modulating the expression of epidermal barrier-associated proteins such as filaggrin and involucrin. In addition, CF70E attenuated MAPK activation in RBL-2H3 and RAW264.7 cells.","Taken together, these findings demonstrate that CF70E exerts multiple biological activities related to mast cell degranulation, inflammatory regulation, and epidermal homeostasis. The present results support the potential utilization of C. fragile as a marine-derived natural functional material for the development of products targeting itch-associated inflammatory skin conditions and provide a biological basis for the industrial application of this underutilized marine resource"],"keywords":"Codium fragile, Itch-relief, Anti-inflammatoty, β-hexosaminidase","ack":"","authors":["Kyeong Rok Kang","Seul Ah Lee","Do Kyung Kim"],"id":"P-03","type":"poster","session":"포스터","page":32,"printed":30,"has_figure":false,"alias":"조선대학교 조선대"},{"title":"Isolation of Rare Actinomycetes and Discovery of Novel Natural Products Using an iChip-Inspired Cultivation Approach","affiliations":["1 Natural Product Systems Biology Center, Korea Institute of Science and Technology, Gangneung 25451, Republic of Korea","2 Natural Product Applied Science, KIST School, University of Science and Technology, Gangneung 25451, Republic of Korea","3 Department of Biology, Kangwon National University, Gangneung 25457, Republic of Korea"],"abstract":["Microbial secondary metabolites remain an invaluable source of therapeutic lead compounds, yet conventional laboratory cultivation limits access to the vast chemical diversity of uncultured microbes. To overcome rediscovery challenges and access specialized metabolites from fastidious microbes, we implemented a modified cultivation approach based on the in situ cultivation (iChip). Cell suspensions prepared from the aerial parts, belowground parts, and rhizosphere soil of Calanthe coreana Nakai were mixed with 1/10-strength YME agar, dispensed into 96-well filter plates, and incubated for 8 weeks either standardly or on top of soil collected from the C. coreana cultivation site. In the absence of soil exposure, 14 bacterial strains, including 6 actinomycetes, were isolated, whereas incubation on cultivation-site soil yielded 18 bacterial strains, including 14 actinomycetes, and 10 fungal strains. Notably, the number of actinomycete isolates increased from 6 to 14 following incubation on cultivation-site soil, and diverse actinomycete genera, including Streptomyces, Actinacidiphila, Embleya, and Geodermatophilus, were recovered. Among these isolates, an Embleya sp. strain was selected for metabolite profiling. LC-MS and HR-MS analyses revealed 8 major metabolite peaks, 6 of which were identified as known compounds, whereas 2 were distinguished from previously reported compounds. The two metabolites exhibited UV absorption characteristics consistent with a salicylic acid-derived chromophore and MS/MS fragmentation patterns similar to those of catenulobactins A and B, suggesting that they represent novel derivatives of the catenulobactin family. The compounds were subsequently isolated and purified by preparative HPLC, and structural elucidation using 1D and 2D NMR spectroscopy is ongoing. These finding demonstrate that an iChip-inspired in situ simulation approach effectively facilitates the isolation of previously inaccessible rare actinomycetes, serving as powerful platform for discovery novel natural products."],"keywords":"modified in situ cultivation, Calanthe coreana, rare actinomycetes, Embleya, microbial secondary metabolites, catenulobactin, metabolite profiling","ack":"","authors":["Hee-Tae Yeo","Na Yul Woo","Sooyeon Lee","Jin-Soo Park"],"id":"P-04","type":"poster","session":"포스터","page":33,"printed":31,"has_figure":false,"alias":"강원대학교 강원대 한국과학기술연구원 KIST"},{"title":"Serum Metabolite Profiling in a Clinical Trial of Black Ginseng for Liver Function Improvement: An NMR and GC-TOF/MS Based Study","affiliations":["1 BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea","2 Department of Herbal Crop Research, National Institute of Horticultural and Herbal Science, RDA, Eumseong 27709, Republic of Korea"],"abstract":["This study aims to characterize changes in the serum metabolome following black ginseng supplementation and explore their associations with clinical indicators of liver function. Serum samples were obtained from a 12-week, multicenter, randomized, double-blind, placebo-controlled clinical trial evaluating the efficacy and safety of black ginseng for improving liver function. Samples collected from the placebo and black ginseng groups at V2 (week 2) and V4 (week 4) are being analyzed by nuclear magnetic resonance (NMR) spectroscopy and gas chromatography–time-of-flight mass spectrometry (GC-TOF/MS). For NMR analysis, serum samples undergo protein removal and buffer adjustment. Separate aliquots undergo organic solvent extraction and derivatization for GC-TOF/MS analysis. Endogenous metabolites, including amino acids, organic acids, and sugars, will be identified or putatively annotated using authentic standards and spectral libraries. After quality control and normalization, metabolite levels will be compared between groups and across visits using multivariate and univariate analyses that account for repeated measurements within participants. Associations between changes in candidate metabolites and changes in clinical indicators of liver function and antioxidant markers will also be explored.","This study may provide insights into changes in serum metabolites following black ginseng supplementation and their potential relationship with liver function."],"keywords":"Black ginseng, clinical trial, human serum, NMR, GC-TOF/MS","ack":"","authors":["Woo-Cheol Shin","Jin-Kyu Jang","Hyeon Seon Na","Bo-Ram Choi","Young-Seob Lee","Dae Young Lee"],"id":"P-05","type":"poster","session":"포스터","page":34,"printed":32,"has_figure":false,"alias":"경북대학교 경북대 국립원예특작과학원 원예특작과학원 농촌진흥청 농촌진흥청 농진청"},{"title":"Protective Effects of Black Ginseng Extract Against Ethanol-Induced Hepatic Injury and the Potential Role of Ginsenoside Rh1: In Vivo, In Vitro, and In Silico Studies","affiliations":["1 BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea","2 Department of Genetic Engineering, Graduate School of Biotechnology, Kyung Hee University, Yongin 17104, Republic of Korea","3 Department of Herbal Crop Research, National Institute of Horticultural and Herbal Science, Rural Development Administration, Eumseong 27709, Republic of Korea"],"abstract":["Alcohol-induced liver damage (AILD), associated with chronic alcohol consumption, is characterized by oxidative stress and inflammation and remains a major health concern. Black ginseng, produced through repeated thermal processing of ginseng, has been reported to exhibit various pharmacological activities. However, its protective effects against AILD and the underlying mechanisms remain unclear. This study investigated the protective effects of black ginseng extract (BGE) against AILD and the potential molecular role of ginsenoside Rh1 using in vivo, in vitro, and in silico approaches. In ethanol-treated mice, BGE significantly reduced serum AST and ALT levels and increased hepatic catalase (CAT) and superoxide dismutase (SOD) activities. In HepG2 cells, BGE inhibited nitric oxide production, suppressed TNF-α, iNOS, COX-2, and IL-6 expression, and increased HO-1 expression. Ginsenoside Rh1 was quantified in BGE using UPLC-Q-TRAP-MS/MS. Network pharmacology and molecular docking analyses identified potential targets, signaling pathways, and multi-target interactions associated with Rh1.","Collectively, these findings suggest that BGE and ginsenoside Rh1 exert hepatoprotective effects by modulating oxidative stress and inflammatory signaling pathways. Rh1 may also serve as a quality control marker of BGE, supporting the potential application of BGE for the prevention and treatment of AILD."],"keywords":"Black ginseng, Ginsenoside Rh1, Alcohol-induced liver damage, Oxidative stress, Inflammation, Network pharmacology","ack":"","authors":["Hyeon Seon Na","Jeon Hwang-Bo","Woo-Cheol Shin","Jin-Kyu Jang","Bo-Ram Choi","Dae Young Lee"],"id":"P-06","type":"poster","session":"포스터","page":35,"printed":33,"has_figure":false,"alias":"경북대학교 경북대 경희대학교 경희대 국립원예특작과학원 원예특작과학원 농촌진흥청"},{"title":"Integrated Chemical Profiling, Metabolomics, and Network Pharmacology of Platycodon grandiflorum Extract against Ethanol-Induced Liver Injury","affiliations":["1 BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea","2 Department of Herbal Crop Research, National Institute of Horticultural and Herbal Science, RDA, Eumseong 27709, Republic of Korea"],"abstract":["This study investigated the effects of Platycodon grandiflorum extract (PGE) on ethanol-induced liver injury using UPLC-Q-TOF/MS chemical profiling, NMR-based metabolite analysis, and network pharmacology","Deapi-platycodin D3, a triterpenoid saponin, was identified as a characteristic constituent of PGE. In mice with ethanol-induced liver injury, PGE (50–200 mg/kg) reduced serum AST and ALT levels, improved hepatic antioxidant measures, and alleviated lipid accumulation and histopathological damage. NMR-based metabolomic analysis showed partial attenuation of ethanol-associated metabolic changes.","In ethanol-treated HepG2 cells, PGE improved cell viability, decreased NO production, suppressed the expression of iNOS, COX-2, IL-6, and TNF-α, and increased HO-1 expression. Deapi-platycodin D3 also attenuated ethanol-induced cytotoxicity. Network pharmacology analysis indicated that the predicted targets associated with deapi-platycodin D3 were involved in inflammation- and oxidative stress-related pathways. These predictions were broadly consistent with the biological responses observed in the experimental models.","These findings suggest that PGE may alleviate ethanol-induced liver injury, with deapi-platycodin D3 as a potential contributing constituent."],"keywords":"Platycodon grandiflorum, Deapi-platycodin D3, NMR-based metabolomics, Network pharmacology, Alcoholic liver injury","ack":"","authors":["Jin-Kyu Jang","Woo-Cheol Shin","Hyeon Seon Na","Dahye Yoon","Dae Young Lee"],"id":"P-07","type":"poster","session":"포스터","page":36,"printed":34,"has_figure":false,"alias":"경북대학교 경북대 국립원예특작과학원 원예특작과학원 농촌진흥청 농촌진흥청 농진청"},{"title":"Network Pharmacology-Guided Evaluation of Phedimus aizoon Flavonoids in BV2 Microglial Cells","affiliations":["1 BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea","2 Research Institute of Pharmaceutical Sciences, College of Pharmacy, Chosun University, Gwangju 61452, Republic of Korea"],"abstract":["Phedimus aizoon is a medicinal plant containing phenolic compounds and flavonoid glycosides. This study isolated flavonoids from P. aizoon and investigated their potential relevance to neuroinflammation using network pharmacology, molecular docking, and a cellular assay.","Compounds were isolated by open-column chromatography and medium-pressure liquid chromatography. Their molecular masses were examined by UPLC-Q-TOF/MS, and their structures were elucidated by NMR spectroscopy. Six flavonoids were identified as myricitrin, quercitrin, 2″-O-galloylmyricitrin, 3″-O-galloylmyricitrin, 2″-O-galloylquercitrin, and 3″-O-galloylquercitrin.","Network pharmacology analysis was conducted to identify potential targets and biological pathways associated with neuroinflammation. Protein–protein interaction analyses identified eight predicted hub genes associated with neuroinflammation-related pathways. Molecular docking was used to predict interactions between the isolated compounds and selected target proteins. The effects of the compounds on cell viability and nitric oxide production were then evaluated in lipopolysaccharide-stimulated BV2 microglial cell.","Collectively, These findings provide a basis for further investigation of P. aizoon flavonoids as potential modulators of neuroinflammatory responses."],"keywords":"Phedimus aizoon, Neuroinflammation, Flavonoids, Network pharmacology","ack":"","authors":["Yong Jae Jeong","Jin-Kyu Jang","Woo-Cheol Shin","Hyeon Seon Na","Jeong Hyun Park","Dong-Sung Lee","Dae Young Lee"],"id":"P-08","type":"poster","session":"포스터","page":37,"printed":35,"has_figure":false,"alias":"경북대학교 경북대 조선대학교 조선대"},{"title":"Isolation and Identification of Compounds from Schisandra chinensis Pomace and Network Pharmacology-Based Evaluation of Their Potential Biological Activities","affiliations":["BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea"],"abstract":["Schisandra chinensis fruit is widely used in food ingredient and herbal medicine, but its processing generates pomace that may retain bioactive constituents. This study aimed to isolate and identify compounds from S. chinensis pomace (SCP) and explore their potential biological relevance using network pharmacology.","SCP was extracted with methanol and partitioned into EtOAc, n-BuOH, and aqueous fractions. Compounds were isolated from the EtOAc fraction by repeated open-column chromatography. Their structures were determined using 1D and 2D NMR spectroscopy, supported by accurate-mass data from UPLC-Q-TOF/MS. Network pharmacology was used to predict potential protein targets and associated pathways, and selected compound–target interactions were assessed by molecular docking.","In the network pharmacology analysis, GO and KEGG enrichment analyses revealed functions and pathways associated with the predicted targets, while protein-proein interaction (PPI) network and topology analyses identified key target proteins. Neuroprotection-related pathways and proteins were identified, suggesting that compounds isolated from SCP may have neuroprotective potential.","Overall, this study is expected to contribute to the reevaluation of SCP and provide fundamental information for its potential use as a functional food ingredient."],"keywords":"Schisandra chinensis pomace, Column chromatography, NMR, LC/MS, Network Pharmacology","ack":"","authors":["Gun Woo Kim","Hyeon Seon Na","Seo Yeon Lee","Young geon Han","Dae Young Lee"],"id":"P-09","type":"poster","session":"포스터","page":38,"printed":36,"has_figure":false,"alias":"경북대학교 경북대"},{"title":"An Integrated Approach to the Extraction, Fractionation and Structural Characterization of Acidic Polysaccharides from Processed Korean Ginseng","affiliations":["BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea"],"abstract":["Acidic polysaccharides from Korean ginseng have attracted interest for their reported biological activities. However, their composition and structural properties vary according to processing and extraction conditions. This study aimed to compare polysaccharide fractions from white, red, and black ginseng and characterize fractions enriched in acidic polysaccharides.","Ginseng samples were pretreated with aqueous ethanol at different concentrations and subsequently extracted with hot water under reflux. The resulting crude polysaccharides were fractionated according to molecular weight using an Amicon ultrafiltration system, and the acidic polysaccharide content of each fraction was quantified using the carbazole–sulfuric acid assay. Neutral and acidic fractions were separated by DEAE-cellulose chromatography. The fraction most enriched in acidic polysaccharides was purified and desalted, followed by GC-TOF/MS monosaccharide profiling and NMR structural analysis.","This approach enables comparison of polysaccharide fractions across differently processed ginseng samples. Further compositional and structural analyses will help identify fractions for subsequent structure–activity studies."],"keywords":"Acidic polysaccharides, Processed ginseng, ion-exchange chromatography, GC-TOF/MS, Structural characterization, NMR spectroscopy","ack":"","authors":["Seo Yeon Lee","Jin-Kyu Jang","Young Geon Han","Gun Woo Kim","Won Jin Choi","Dae Young Lee"],"id":"P-10","type":"poster","session":"포스터","page":39,"printed":37,"has_figure":false,"alias":"경북대학교 경북대"},{"title":"Structural Elucidation of Isolated Metabolites and Comprehensive profiling of Mulberry fruit Across Maturation Stages","affiliations":["BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea"],"abstract":["Mulberry fruit (Morus alba L.) contains diverse bioactive constituents whose composition changes during maturation. This study investigated metabolite variation across fruit maturation stages and explored candidate chemical markers for quality evaluation.","In this study, immature and mature fruits were extracted and fractionated separately, and the resulting extracts were combined for chromatographic isolation of individual metabolites. The structures of the isolated compounds were elucidated using NMR spectroscopy, and an in-house metabolite library was established for subsequent metabolite profiling. For profiling, fruits were harvested at five maturation stages, and metabolite variations were analyzed using UPLC-Q-TOF/MS-based profiling combined with multivariate statistical analyses, including PCA and PLS-DA. The metabolomic analysis revealed distinct differences in chemical composition among maturation stages, indicating that specific metabolites are closely associated with fruit developmental status.","These results provide insight into maturation dependent metabolic changes in mulberry fruit and may contribute to the identification of chemical markers for quality control, standardization, and functional material development."],"keywords":"Mulberry, NMR, metabolite profiling, UPLC-Q-TOF/MS, multivariate statistical analysis","ack":"","authors":["Young geon Han","Woo-Cheol Shin","Gun woo Kim","Seo Yeon Lee","Sin Hee Park","Dae Young Lee"],"id":"P-11","type":"poster","session":"포스터","page":40,"printed":38,"has_figure":false,"alias":"경북대학교 경북대"},{"title":"Apoptosis and Autophagy Inducing Effects of a New Quinone Compound on HCT116 Colorectal Cancer Cells","affiliations":["1 Department of Biology, Kangwon National University, Gangneung 25457, Republic of Korea"],"abstract":["Natural products are important resources for drug development because of their diverse biological activities and structural diversity, and they have contributed to anticancer agent development. Colorectal cancer continues to have high incidence and mortality worldwide, underscoring the ongoing need for new anticancer agents. In a previous study, a 1,4-naphthoquinone–indole conjugate metabolite derived from gut microbiota exhibited cytotoxic activity. Based on this compound, we synthesized amiquinone, a new quinone compound with stronger cytotoxic activity. In this study, we found that amiquinone induced apoptosis in human colorectal cancer HCT116 cells. It increased PARP and caspase-3 cleavage, while flow cytometry showed a larger population of apoptotic cells. RNA sequencing revealed higher TNFRSF10B expression, suggesting activation of the extrinsic apoptotic pathway. Transcriptomic profiling also identified changes in genes related to ER stress, MAPK signaling, oxidative stress, and autophagy. Autophagy involvement was supported by increased MAP1LC3B transcript levels, increased LC3B-I to LC3B-II conversion, and reduced p62 protein levels. Overall, this study is the first to show the cytotoxic activity of amiquinone in HCT116 cells and suggests that amiquinone induces apoptosis and autophagy. These findings provide insight into the cellular mechanisms underlying the cytotoxic activity of amiquinone, a new quinone compound derived from a gut microbiota metabolite."],"keywords":"1,4-naphthoquinone, Microbial metabolites, Colorectal Cancer, apoptosis, autophagy","ack":"","authors":["Ye Jin Kim","Hyun Bong Park"],"id":"P-12","type":"poster","session":"포스터","page":41,"printed":39,"has_figure":false,"alias":"강원대학교 강원대"},{"title":"Structure elucidation and in-silico study of megastigmane glycosides from the extract of Ardisia humilis Vahl leaves to PPARs receptor for the treatment of metabolic syndrome","affiliations":["1 Natural Product Research Center, Korea Research Institute of Bioscience and Biotechnology","2 KRIBB-SCHOOL, University of Science and Technology","3 Research Center for Pharmaceutical Ingredients and Traditional Medicine, BRIN","4 International Biological Material Research Center, KRIBB"],"abstract":["Ardisia humilis Vahl. (AHV), known as Lampeni, which distributes widely across the tropical rainforests of Southeast Asia. This plant has traditionally been used in various forms of medicinal herbs on the Sumatra island in Indonesia. Previous phytochemical studies have revealed that AHV contains of secondary metabolites, including carotenoids, flavonoids, triterpenoids, and megastigmane derivatives. Megastigmanes are C13 compounds with a structure basically consisting of a backbone of six carbon atoms, with two methyl groups substituted at the C-1 position, a methyl group at the C-5 position, and four carbon atoms connected at the C-6 position. The glycosides attached to megastigmanes increase their water solubility, making them emerging bioactive plant compounds that help mitigate metabolic syndrome by suppressing chronic inflammation, reducing oxidative stress, and regulating lipid and glucose metabolism from natural products. Meanwhile, there are few specific studies focusing on the metabolic processes of these megastigman glycosides with PPARs receptors. In this study, megastigman glycosides were isolated from AHV followed by computer docking to evaluate their potential as PPARs receptor. The molecular docking results revealed that the lowest binding energies fell within the range of -6.1 to -12.3 kcal/mol with RMSD value of < 2.0. Therefore, this in-silico simulation study is crucial for serving as a guideline regarding the biological activity of the substances, and these findings can support further biological studies."],"keywords":"Ardisia humilis, in-silico, megastigmane glycosides","ack":"","authors":["Alfan Danny Arbianto","Seon Min Oh","Hyoung-Geun Kim","Jongmin Ahn","Kyujong Lee","Ngatinem Ngatinem","Agung Eru Wibowo","Jin-Hyub Paik","Hyung Won Ryu","Sofa Fajriah","Sangho Choi","Sei-Ryang Oh"],"id":"P-13","type":"poster","session":"포스터","page":42,"printed":40,"has_figure":false,"alias":"인도네시아 국가연구혁신청 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Phytochemical Profiling and Analytical Method Validation for the Quality Assessment of Ardisia humilis Vahl","affiliations":["1 Natural Product Research Center, Korea Research Institute of Bioscience and Biotechnology","2 KRIBB-SCHOOL, University of Science and Technology","3 Research Center for Pharmaceutical Ingredients and Traditional Medicine, BRIN","4 International Biological Material Research Center, KRIBB"],"abstract":["Ardisia humilis Vahl (AHV) is one medicinal plant used in Indonesia jamu, popularly known as Lampeni which is widely distributed in two big islands in Sumatra and Java. It has been commonly used as traditional medicine to treat stomach and skin problems. AHV has been reported to be rich in phenolic and flavonoid content which has exhibited various biological activities including antioxidant. Jamu is often produced without any standard that is used to maintain the quality of the extract product, therefore jamu has inconsistency in efficacy and in the process of extract production with high flavonoid content. In this study, metabolomic-based screening was conducted to screen phytochemical composition of AHV to get flavonoid-rich fraction for jamu production followed by TLC and HPLC validation of the kaempferol as reference standard to control quality of AHV. The developed TLC effectively identified the kaempferol with a visible detection limit (LOD) of 25 ppm, making it suitable for rapid raw material verification. The linear regression analysis data for the calibration plots showed a good linear relationship over the concentration range of 1.56 – 200 μg/mL for kaempferol. The method was validated for linearity, precision, robustness and recovery according to ICH guidelines. Statistical analysis showed that the method was repeatable and reproducibility in various tested column types that can be applied for routine quality control of raw materials in industry."],"keywords":"Ardisia humilis, phytochemical, validation","ack":"","authors":["Alfan Danny Arbianto","Seon Min Oh","Jongmin Ahn","Kyujong Lee","Ngatinem Ngatinem","Agung Eru Wibowo","Jin-Hyub Paik","Hyung Won Ryu","Sofa Fajriah","Sangho Choi","Sei-Ryang Oh"],"id":"P-14","type":"poster","session":"포스터","page":43,"printed":41,"has_figure":false,"alias":"인도네시아 국가연구혁신청 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Metabolomic signatures of functional phytochemical diversity in spinach cultivars","affiliations":["1 Natural Product Research Center and Natural Product Central Bank, KRIBB, 30-Yeongudanji-ro, Ochang-eup, Cheongwon- gu, Cheongju-si, Chungcheongbuk-do, 28116, Korea","2 College of Pharmacy, Graduate School of Pharmaceutical Sciences, Ewha Womans University, 52, Ewhyeodae-gil, Seodaemun-gu, Seoul, 03760, Korea"],"abstract":["Spinach (Spinacia oleracea L.) is a widely consumed leafy vegetable recognized for its nutritional value and diverse phytochemical composition. However, comprehensive information on cultivar-dependent variation in spinach metabolites remains limited. In this study, LC-MS-based untargeted metabolomics was employed to characterize phytochemical diversity among 15 spinach cultivars cultivated under the same conditions. Aerial tissues were extracted with 80% ethanol and analyzed using ultra-high-performance liquid chromatography coupled with quadrupole time-of-flight mass spectrometry (UPLC-QTOF/MS). Metabolites were tentatively identified based on accurate mass, molecular formula, and MS/MS fragmentation patterns, and multivariate statistical analyses were performed to investigate cultivar-associated metabolic variation.","A total of 37 metabolites were profiled, including phenolic acids, flavonoids and flavonoid glycosides, coumarins, and triterpenoid saponins. In particular, diverse spinacetin- and patuletin-derived flavonoid glycosides and a series of spinach saponins, including spinaciasaponins A–E, celosin I, and medicagenic acid-and yunganogenin K-type saponins, were detected. Principal component analysis revealed distinct metabolic patterns among the 15 cultivars, and loading plots and comparative analyses identified metabolites that contributed to cultivar discrimination. The major discriminatory metabolites consisted primarily of triterpenoid saponins and flavonoid glycosides. Saponin-associated variation was characterized by differences in glycosylation patterns and aglycone types, with medicagenic acid-type saponins containing five to six sugar moieties and medicagenic acid/yunganogenin K-type saponins containing three to four sugar moieties contributing to cultivar separation. Flavonoid-associated discrimination was mainly attributed to differences in spinacetin- and patuletin-derived glycosides.","These findings demonstrate substantial cultivar-dependent phytochemical diversity in spinach and identify characteristic saponin and flavonoid glycoside profiles as major contributors to metabolic differentiation among cultivars. This study provides a metabolomic basis for the characterization and selection of spinach cultivars with distinct phytochemical compositions and may contribute to the development of spinach germplasm with enhanced functional and nutritional value."],"keywords":"Flavonoid glycosides, Spinach (Spinacia oleracea L.), Triterpenoid saponins, Untargeted metabolomics, UPLC-QTOF/MS","ack":"","authors":["Su-Yeon Lee","Hyoung-Geun Kim","Doo-Young Kim","Su-Ah Lee","Seul Beom Yu","Jongmin Ahn","Sei-Ryang-Oh","Eun Kyoung Seo","Hyung Won Ryu"],"id":"P-15","type":"poster","session":"포스터","page":44,"printed":42,"has_figure":false,"alias":"이화여자대학교 이화여대 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Seasonal metabolomic variation and anticancer potential of bioactive metabolites in Paulownia tomentosa fruits","affiliations":["1 Natural Product Research Center and Natural Product Central Bank, KRIBB, 30-Yeongudanji-ro, Ochang-eup, Cheongwon- gu, Cheongju-si, Chungcheongbuk-do, 28116, Korea","2 College of Pharmacy, Graduate School of Pharmaceutical Sciences, Ewha Womans University, 52, Ewhyeodae-gil, Seodaemun-gu, Seoul, 03760, Korea","3 Bio Dx Group, InSiliCox, 202-ho, 42 Bongeunsa-ro 30-gil, Gangnam-gu, Seoul 06136, Korea","4 Faculty of Software Convergence, Sangmyung University, 20 Hongjimun 2-gil, Jongno-gu, Seoul 03016, Korea","† These authors have equally contributed as the first author"],"abstract":["Paulownia tomentosa is a fast-growing deciduous tree traditionally used in herbal medicine for inflammatory and infectious diseases. Previous phytochemical studies have reported that P. tomentosa fruits are rich in phenylethanoid glycosides and C-geranylated flavonoids with diverse biological activities. However, dynamic changes in the anticancer potential of metabolites during fruit development remain poorly understood. This study aimed to identify characteristic metabolites and determine the optimal harvest time using UPLC-QTOF-MS-based metabolomics, and cancer cell inhibition assays.","Multivariate analyses revealed distinct clustering according to growth stages. A total of 36 metabolites were tentatively identified, including phenylethanoids/phenylpropanoids glycosides and C-geranylated flavonoids. Five marker compounds were isolated and structurally characterized using UPLC-QTOF-MS and ¹H/¹³C NMR analyses. Quantitative analysis revealed seasonal differences, with compound 4 predominantly detected in July, compounds 2 and 3 enriched in August, and compounds 1 and 5 highest in September.","Diplacone and compound 4 exhibited strong cytotoxic effects against A549 and HepG2 cells, whereas compound 2 showed greater cytotoxicity toward HepG2 cells. Network-based target analysis identified inflammation-related hub genes, including PTGS2, IL6, TNF, and ALOX5. Notably, compound 4 uniquely showed direct TNF binding and associations with NFKB1 and CASP8, suggesting involvement of NF-κB signaling and apoptosis-related pathways.","These findings provide metabolomic and functional insights into seasonal phytochemical variation in P. tomentosa fruits and suggest optimal harvest periods for bioactive C-geranylated flavonoids."],"keywords":"C-geranylated flavonoids; Metabolomics; Paulownia tomentosa; Seasonal variation; UPLC-QTOF-MS","ack":"","authors":["Su-Yeon Lee","In-Seo Heo","Hyoung-Geun Kim","Mun-Ock Kim","Inhyeok Song","Jaeha Kang","Jaewon Yang","Eun-Bin Kwon","Myung-Ji Kang","Doo-Young Kim","Jung-Hee Kim","Sei-Ryang-Oh","Daesik Jeong","Eun Kyoung Seo","Hyung Won Ryu"],"id":"P-16","type":"poster","session":"포스터","page":45,"printed":43,"has_figure":false,"alias":"상명대학교 상명대 이화여자대학교 이화여대 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Comparative metabolomic profiling of Lysimachia mauritiana Lam. across cultivation environments: Differentially abundant metabolites and environment-specific biomarkers","affiliations":["1 Natural Product Research Center and Natural Product Central Bank, KRIBB, 30-Yeongudanji-ro, Ochang-eup, Cheongwon- gu, Cheongju-si, Chungbuk, 28116, Republic of Korea","2 College of Pharmacy, Graduate School of Pharmaceutical Sciences, Ewha Womans University, 52, Ewhyeodae-gil, Seodaemun-gu, Seoul, 03760, Korea","3 Kolmar BNH, 6-Hanbang expo-ro, Jecheon-si, Chungcheongbuk-do, 27116, Republic of Korea","4 College of Ecology and Environmental Science, Kyungpook National University, 2559, Gyeongsang-daero, Sangju, Gyeongsangbuk-do, 37224, Korea","5 International Biological Material Research Center, KRIBB, 125-Gwahak-ro, Yuseong-gu, Daejeon, 34141, Republic of Korea"],"abstract":["Lysimachia mauritiana Lam. is an underutilized edible coastal plant belonging to the family Primulaceae. Its young shoots are consumed as a seasonal vegetable in Korea, but information on its cultivation-dependent metabolite variation and functional properties remains limited. In this study, L. mauritiana cultivated under three different environments—open field, plant factory, and glass greenhouse—was investigated to evaluate changes in secondary metabolites and antioxidant potential. Comparative metabolomic profiling was performed using an LC-MS/MS system, and multivariate statistical analysis revealed distinct metabolite patterns among cultivation environments. Differentially abundant metabolites (DAMs) were identified, and key biomarkers representing each cultivation condition were selected. In parallel, antioxidant activities and phytochemical contents were evaluated using 70% ethanolic extracts and Diaion HP-20 fractions. DPPH and ABTS radical scavenging assays were conducted with trolox as a positive control, and TPC, TFC, and TSC were determined using gallic acid, quercetin, and escin as reference standards, respectively. The extracts and fractions showed cultivation- and fraction-dependent differences in antioxidant activity and phytochemical contents. These results suggest that cultivation environment influences both the metabolite composition and functional properties of L. mauritiana. This study provides a scientific basis for establishing optimal cultivation conditions and supports the potential use of L. mauritiana as a functional food material."],"keywords":"Cultivation environment; Metabolomics; Antioxidant activity","ack":"","authors":["Su-Ah Lee","Hyoung-Geun Kim","Hangyeol Lee","Doo-Young Kim Su-Yeon Lee","Seul Beom Yu","Soo Ho Yeon","Hyoung Tae Kim","Jin-Hyub Paik","Sei-Ryang Oh","Eun Kyoung Seo","Hyung Won Ryu"],"id":"P-17","type":"poster","session":"포스터","page":46,"printed":44,"has_figure":false,"alias":"경북대학교 경북대 이화여자대학교 이화여대 콜마 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Identification of tissue-specific chemical markers and antioxidant activities in different plant parts of Vitex rotundifolia L. f. using UPLC-QTOF/MS-based metabolomics","affiliations":["1 Natural Product Research Center, Korea Research Institute of Bioscience and Biotechnology KRIBB, 30-Yeongudanji-ro, Ochang-eup, Cheongwon-gu, Cheongju-si, Chungbuk, 28116, Republic of Korea","2 Department of Plant Biotechnology, College of Life Sciences and Biotechnology, Korea University, 145-Anam-ro, Seongbuk- gu, Seoul, 02841, Republic of Korea","3 Biodiversity Research Institute, Clean Bio Business Division, JejuTechnopark, 338, Sinryedong-ro, Namwon-eup, Seogwipo- si, Jeju-do, 63608, Republic of Korea"],"abstract":["Vitex rotundifolia L. f. is a coastal halophyte belonging to the family Verbenaceae and is widely distributed throughout Korea, including Jeju Island, as well as in China, Japan, and Southeast Asia. The fruits of this plant have traditionally been used as a medicinal resource and is known to possess various biological activities, including antioxidant, anti-inflammatory, and analgesic effects. Previous phytochemical studies have reported that V. rotundifolia contains diverse secondary metabolites, such as flavonoids, diterpenoids, and iridoids. In this study, we investigated the major metabolite markers and antioxidant activities of different plant parts of V. rotundifolia, including leaves, stems, and seeds, were investigated. Extracts from each part were analyzed using UPLC–QTOF/MS, and multivariate analyses, including PCA, PLS-DA, and OPLS-DA, were performed to evaluate metabolic differences and identify tissue-specific chemical markers. Distinct metabolite profiles were observed among the different plant parts, enabling the characterization of representative markers metabolites associated with each tissue. In addition, antioxidant activity was evaluated using DPPH and ABTS radical scavenging assays, and it correlations between radical scavenging activities and phytochemical composition, including total phenolic content (TPC), total flavonoid content (TFC), and total saponin content (TSC), were further analyzed. The results provide useful insights into the phytochemical diversity and bioactive potential of V. rotundifolia, supporting its potential application as a functional material and natural product-based pharmacological resource."],"keywords":"Metabolite profiling, Tissue-specific markers, Antioxidant activity","ack":"","authors":["Seul Beom Yu","Hyoung-Geun Kim","Hangyeol Lee","Doo-Young Kim","In Soo Suh","Sung Chun Kim","Sei-Ryang Oh","Dongho Lee","Hyung Won Ryu"],"id":"P-18","type":"poster","session":"포스터","page":47,"printed":45,"has_figure":false,"alias":"고려대학교 고려대 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Relationship between Chemical Composition and Biological Activity of Supercritical Fluid Extracted Arthropod Biomass","affiliations":["Ecological Technology Research Team, National Institute of Ecology, Seocheon-gun 33657, Republic of Korea"],"abstract":["Supercritical carbon dioxide (SC–CO₂) extraction is an environmentally friendly technique for recovering lipophilic bioactive compounds from natural resources. In this study, SC–CO₂ extraction was applied to five edible or medicinal arthropod species (Protaetia brevitarsis seulensis, Zophobas morio, Gryllus bimaculatus, Ptecticus tenebrifer, and Scolopendra subspinipes mutilans) under standardized conditions (400 bar, 50 °C, and 180 min). Extraction yields were determined, and the chemical composition of the most active extract was characterized by GC–MS. Among the tested species, S. subspinipes mutilans exhibited the strongest biological activities despite its relatively low extraction yield, indicating that biological activity was more closely associated with chemical composition than extraction efficiency. GC–MS analysis revealed that the SC–CO₂ extract was enriched with fatty acids, fatty acid esters, and glyceride derivatives. Comparative screening of the identified constituents further showed that 4-hydroxyphenylacetic acid (4-HPAA) was the most promising lead compound, as it suppressed DOPA oxidation and intracellular melanogenesis without detectable cytotoxicity under the tested conditions. Several additional constituents also displayed anti-tyrosinase activity, indicating that the anti-melanogenic effect of the biomass extract is associated with a chemically definable constituent profile rather than a nonspecific crude extract effect."],"keywords":"Scolopendra subspinipes mutilans, Supercritical CO2 extraction, GC–MS profiling","ack":"","authors":["Won Jun Lee"],"id":"P-19","type":"poster","session":"포스터","page":48,"printed":46,"has_figure":false,"alias":"국립생태원"},{"title":"Contribution of Minor Coumarins to the Anti-inflammatory Activity of Cnidium monnieri Assessed by Knock-out Fractionation","affiliations":["1 Department of Food Science and Technology, College of Natural Resources and Life Science, Pusan National University, Miryang 50463, Republic of Korea","2 Institute for Future Earth, Pusan National University, Busan 46241, Republic of Korea","3 Food Tech Innovation Center, Life and Industry Convergence Research Institue, Pusan national University, Miryang, Republic of Korea"],"abstract":["Atopic dermatitis (AD) is a chronic inflammatory skin disorder characterized by dysregulated inflammatory responses in the epidermis. Cnidium monnieri contains diverse bioactive coumarins, among which osthole and imperatorin are the major constituents. However, the contribution of less abundant coumarins to its anti-inflammatory activity remains inadequately characterized. Quantum mechanics-based quantitative NMR (QM-qNMR) quantified osthole and imperatorin at 16.42% and 6.90% (w/w), respectively, in the crude extract. Centrifugal partition chromatography (CPC) was subsequently employed for selective knock-out fractionation of osthole and imperatorin, generating compositionally defined samples for bioactivity assessment. Anti-inflammatory efficacy was evaluated in TNF-α-/IFN-γ-stimulated HaCaT keratinocytes as an in vitro AD model. The osthole–imperatorin knock-out fraction exhibited the most potent inhibitory activity, indicating that minor coumarins substantially contribute to the anti-AD bioactivity of C. monnieri, potentially via synergistic phytochemical interactions."],"keywords":"Cnidium monnieri, centrifugal partition chromatography, quantum mechanics-based quantitative NMR, anti-inflammatory","ack":"","authors":["Sangmin Lee","Sun Yong Park","Yerim Joo","Eunbeen Shin","Seon Beom Kim"],"id":"P-20","type":"poster","session":"포스터","page":49,"printed":47,"has_figure":false,"alias":"부산대학교 부산대"},{"title":"Chemical Characterization of Bioactive Sulfated Polysaccharides Isolated from
