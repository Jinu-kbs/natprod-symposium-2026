Stichopus japonicus","affiliations":["1 Department of Food Science and Technology, College of Natural Resources and Life Science, Pusan National University, Miryang 50463, South Korea","2 Institute for Future Earth, Pusan National University, Busan 46241, South Korea","3 Food Tech Innovation Center, Life and Industry Convergence Research Institute, Pusan National University, Miryang, South Korea"],"abstract":["Marine organisms represent a valuable source of structurally diverse natural products with unique chemical features and biological properties. Among them, sulfated polysaccharides (SPs) are complex marine-derived macromolecules characterized by diverse monosaccharide compositions, glycosidic linkages, and sulfation patterns. In this study, SPs were isolated and chemically characterized from the sea cucumber Stichopus japonicus to investigate their structural characteristics and potential as bioactive natural products. Raw samples were obtained through enzymatic digestion, selective precipitation, and ethanol precipitation, followed by purification using anion-exchange chromatography. Two major sulfated polysaccharide fractions (Fr. A and Fr. B) were successfully isolated, and their sulfated characteristics were confirmed by dimethylmethylene blue (DMMB) assay. Structural characterization was performed using 1D, 2D NMR spectroscopy, including 1H NMR, COSY, TOCSY, HSQC, HSQC-TOCSY, and NOESY experiments. Detailed NMR signal assignments identified Fr. A as fucosylated chondroitin sulfate (FucCS), mainly composed of fucose, N-acetylgalactosamine, and glucuronic acid residues, whereas Fr. B was characterized as a sulfated fucan (SF) predominantly consisting of sulfated fucose residues. Molecular weight distributions of both fractions were further determined by gel permeation chromatography. The purified FucCS and SF will be further evaluated for their anti-inflammatory activities. These findings provide detailed chemical information on structurally distinct SPs from S. japonicus and contribute to the characterization of marine sulfated polysaccharides as potential anti-inflammatory natural products."],"keywords":"Sulfated polysaccharides, Stichopus japonicus, Extraction and Purification, Characterization","ack":"","authors":["Eunbeen Shin","Ibukunoluwa Fola Olawuyi","Sangmin Lee","Minhyuk Jeong","Seon Beom Kim"],"id":"P-21","type":"poster","session":"포스터","page":50,"printed":48,"has_figure":false,"alias":"부산대학교 부산대"},{"title":"Rapid Screening of Binding Constituents in Blueberry Extract Using Tyrosinase","affiliations":["1 Osong High School, Cheongju, Chungbuk, 28165, Republic of Korea","2 Natural Product Research Center, Korea Research Institute of Bioscience and Biotechnology KRIBB, 30-Yeongudanji-ro, Ochang-eup, Cheongwon-gu, Cheongju-si, Chungbuk, 28116, Republic of Korea"],"abstract":["Tyrosinase는 멜라닌 생합성의 속도 결정 단계를 촉매하는 구리 함유 효소이다. 이 효소가 과도하게 활성화되면 피부 과색소침착이 일어나고, 과일과 채소에서는 효소적 갈변이 발생한다. 이 때문에 tyrosinase 저해제는 화장품, 의약품 및 식품 산업 전반에서 큰 관심을 받고 있다. 그러나 kojic acid, arbutin 등 널리 사용되는 저해제는 안정성과 안전성 측면에서 한계가 있어, 천연물에서 새로운 저해제를 찾으려는 수요가 계속되고 있다. 블루베리는 폴리페놀 화합물이 풍부하여 유망한 후보 소재이지만, 복잡한 식물 추출물에서 활성 성분을 찾아내기는 여전히 어렵다. 기존의 활성 유도 분획법은 분리와 활성 평가를 반복해야 하므로 시간과 노력이 많이 소요되며, 미량 활성 성분을 놓치기 쉽다. 이러한 한계를 극복하기 위해, 표적 단백질과 리간드 간의 특이적 상호작용을 이용하는 친화성 기반 스크리닝 기법이 조추출물에서 생리활성 성분을 직접 선별하는 효율적인 도구로 주목받고 있다. 본 연구에서는 친화성 ultrafiltration와 UPLC-PDA 분석을 결합하여 블루베리 추출물 내 tyrosinase 결합 성분을 신속하게 탐색하고자 하였다. 추출물을 버섯 유래 tyrosinase와 반응시킨 후 한외여과를 통해 비결합 분획을 분리하고 UPLC-PDA로 분석하였다. 효소 양에 따라 결합 조건을 최적화하였으며, 효소 처리군과 미처리군의 크로마토그램 피크 면적을 비교하여 결합 후보 성분을 선별하였다. Tyrosinase 처리 시 피크 면적이 감소한 6개 피크를 티로시나아제 결합 후보 성분으로 선별하였다. 이들 후보 성분은 UPLC-QTOF/MS로 추가 분석하였으며, 정확 질량, 예측 분자식 및 MS/MS 단편화 패턴을 문헌 보고 자료 및 온라인 데이터베이스와 비교하여 구조를 tentative identification 하였다. 본 접근법은 천연물 추출물에서 tyrosinase 표적 화합물을 신속하게 발굴하는 간편하고 효율적인 전략을 제시한다."],"keywords":"blueberry, tyrosinase, affinity ultrafiltration, UPLC-PDA, ligand screening, UPLC-QTOF/MS","ack":"","authors":["Dayeon Kang","Hyoung-Geun Kim","Hyung Won Ryu"],"id":"P-22","type":"poster","session":"포스터","page":51,"printed":49,"has_figure":false,"alias":"오송고등학교 오송고 한국생명공학연구원 생명연 생명공학연구원"},{"title":"Identification of Metabolites and Gene Expression Changes in Vigna angularis L. Sprouts under Indoor and Outdoor Cultivation Conditions Using HPLC-QTOF-MS and RT-PCR","affiliations":["1 Cheongwon High School, 9 Guryong 5-gil, Ochang-eup, Cheongwon-gu, Cheongju 28121, Republic of Korea","2 Natural Product Research Center and Natural Product Central Bank, KRIBB, 30-Yeongudanji-ro, Ochang-eup, Cheongwon- gu, Cheongju-si, Chungcheongbuk-do 28116, Republic of Korea"],"abstract":["주변 환경은 식물의 생장과 대사에 중대한 영향을 미친다. 본 연구에서는 재배 환경에 따른 팥순의 생육 특성 변화를 확인하기 위해 팥(Vigna angularis L.)을 실내와 실외에서 재배하여 팥순에 대한 표현형, 대사체 변화, 생장에 관한 유전자 발현 차이를 분석하였다. 재배 후 형태적 특성을 비교한 결과, 실외 재배 팥순은 실내 재배 팥순에 비해 줄기의 신장이 저조하였으나 줄기가 굵고 잎의 색이 진하였다. 이러한 형태적 차이와 함께 대사산물 조성의 변화를 확인하기 위해 HPLC-QTOF-MS 분석을 통해 실내 재배 팥순과 실외 재배 팥순의 대사산물을 분석하였고, flavonoid계열의 kaempferol 배당체 5종과 Coutaric acid를 확인하였다. 이 화합물들의 피크 면적값을 비교한 결과 flavonoid 계열 화합물의 피크 면적값이 실외 재배 팥순에서 실내 재배 팥순보다 2배 이상 높은 면적을 나타냈다. 또한 이러한 재배 환경에 따른 생육 특성의 차이를 분자 수준에서 확인하기 위해 성장과 관련된 Auxin-responsive protein IAA17(IAA17) 유전자와 강한 빛에 반응하는 Light-Harvesting complex Ⅱ chlorophyll a/b binding protein 1(LHCB1) 유전자를 RT-PCR로 분석하였다. IAA17 유전자는 줄기 신장이 활발한 실내 재배 팥순에서 높게 발현 수준을 보였으며, LHCB1 유전자는 높은 광량에 노출된 실외 팥순에서 높게 발현되였다. 이상의 결과는 낮은 광량의 재배 환경에서는 팥순의 줄기 신장을 촉진하는 반면 광량이 높은 환경은 줄기의 비대와 Flavonoid의 상대적 축적을 증가시키며, 재배 환경에 따라 생장 및 광 반응 관련 유전자의 발현 양상이 달라질 수 있음을 보여준다. 본 연구에서는 재배 환경이 팥순의 생육 특성과 대사산물 조성에 영향을 미치는 주요 요인임을 확인하였다."],"keywords":"Vigna angularis L., HPLC-QTOF-MS, RT-PCR, Cultivation conditions","ack":"","authors":["Bo Gun Jeong","Han gyeol Lee","Hyung Won Ryu"],"id":"P-23","type":"poster","session":"포스터","page":52,"printed":50,"has_figure":false,"alias":"청원고등학교 청원고 한국생명공학연구원 생명연 생명공학연구원"},{"title":"A Study on Functional Materialization Using Persimmon-Peel Biomass and the Development of Cosmetics: Optimization of Enzymatic Fermentation and Ultra-Fine Milling Extraction Processes and Efficacy Evaluation","affiliations":["Convergence R&D Center, Korea Textile Smart Process Institute, Gongju 31156, Republic of Korea"],"abstract":["Persimmon peel, which is generated in large quantities during persimmon processing, is mostly discarded, aggravating resource waste and increasing the burden of waste treatment. This study is a preliminary investigation examining the conditions for materializing discarded persimmon peel as a raw material for bio-additives used in the manufacture of synthetic leather. Persimmon peel — which contains large amounts of functional constituents such as tannins and polyphenols — was subjected to enzymatic fermentation and ultra-fine milling extraction, optimal extraction conditions were established, and the functionality of the extract was evaluated. Fermivin was applied to a persimmon homogenate for fermentation at 40 °C for 2 hours, and Sumizyme AC enzyme was applied for a fermentation reaction at 55 °C for 2 hours. Eight extraction conditions were then compared, combining distilled water and 50% ethanol as solvents with conventional blender extraction and nano-scale ultra-fine milling extraction. Under all conditions, the ultra-fine milling extraction showed higher recovery yields and total polyphenol contents than blender extraction. In addition, the edible portion showed a higher recovery yield than the non-edible portion; however, in this study, the ultra-fine extraction of the non-edible portion with 50% ethanol was selected as the optimal condition (total polyphenol 64.7 GAE mg/g). The extract obtained under the optimal condition exhibited antioxidant activity approaching that of vitamin C; DPPH radical scavenging of 81.8% (16 μg/mL) and xanthine oxidase inhibition of 73.1% (160 μg/mL); and also exhibited wrinkle-improvement-related efficacy, with elastase inhibition of 91.3% (160 μg/mL). A cream-formulation prototype secured good stability over a 4-week harsh (accelerated) test. These results suggest that a low-temperature extraction process combining enzymatic fermentation and ultra-fine milling is an effective technology for the valorization of persimmon by-products into cosmetic materials."],"keywords":"Persimmon by-product, Enzymatic fermentation, Nano-milling extraction, Total polyphenol, Antioxidant, Cosmetic material","ack":"본 연구는 산업통상부(한국산업기술진흥원)의 저탄소기후변화대응을위한지속성장(R&D)사업의 일환으로 수행하였음 [과제고유번호 : RS-2026-25549673, 감 가공 부산물의 기능성 소재화를 통한 바이오매스 기반 친환경 인조피혁 제품화].","authors":["Yu-Rim Lee","Mi-Ae Do","Hwa-Jin Suh"],"id":"P-24","type":"poster","session":"포스터","page":53,"printed":51,"has_figure":false,"alias":"한국섬유스마트공정연구원"},{"title":"Anti-inflammatory Activity of Cheongyeolhaedok-tang via the Regulation of Inflammatory Chemokines and Antimicrobial Peptides in a Psoriasis-Like Human Keratinocyte Model","affiliations":["1 Department of Bio-Cosmetic Science, Semyung University, Jecheon, Chungbuk 27136, South Korea","2 Department of Physiology, College of Korean Medicine, Semyung University, Jecheon, Chungbuk 27136, South Korea"],"abstract":["Psoriasis is a chronic inflammatory skin disease characterized by keratinocyte hyperproliferation and immune dysregulation. Cheongyeolhaedok-tang (淸熱解毒湯; CYHDT), a traditional herbal prescription documented in Donguibogam (東醫寶鑑), has long been used to treat intractable inflammatory skin diseases; however, its molecular mechanisms in chronic skin inflammatory pathogenesis, such as psoriasis, remain to be fully elucidated. Therefore, this study aimed to scientifically validate the anti-inflammatory and psoriasis-alleviating effects of CYHDT using an in vitro cell model. CYHDT was prepared via hot water extraction of medicinal herbs, including Scutellaria baicalensis, Coptis chinensis, and Lonicera japonica, according to the prescription in Donguibogam. To evaluate the antioxidant activity of CYHDT, total polyphenol content (TPC) and DPPH/ABTS radical scavenging assays were performed, demonstrating high radical scavenging and antioxidant capacities. In addition, evaluation of nitric oxide (NO) production in RAW 264.7 cells revealed that CYHDT treatment significantly suppressed NO generation. Subsequently, human keratinocytes (HaCaT) were stimulated with TNF-α, IFN-γ, IL-17A, and IL-22 to induce a psoriasis-like inflammatory condition, followed by treatment with CYHDT at various concentrations. RT-qPCR analysis revealed that CYHDT significantly suppressed the mRNA expression of chemokines (CXCL8, CCL20), a pro-inflammatory cytokine (IL-1β), and an antimicrobial peptide (hBD-2), all of which were upregulated under the psoriatic conditions. Overall, CYHDT effectively alleviated abnormal inflammatory responses and the antimicrobial peptide over-expression in keratinocytes. These findings provide a scientific foundation for the clinical application of traditional herbal prescription and highlight CYHDT as a promising natural bio-material for alleviating psoriatic skin inflammation."],"keywords":"","ack":"","authors":["Tae-hee Go","Na-Yeon Kang","Yeop Jung","Sun-Young Park","Hyung-Seo Hwang"],"id":"P-25","type":"poster","session":"포스터","page":54,"printed":52,"has_figure":false,"alias":"세명대학교 세명대"},{"title":"Protective Effects of Geranium thunbergii Extract Against UV-Induced Skin Aging in Human Dermal Fibroblasts and Zebrafish","affiliations":["1 Korean Medicine Convergence Research Division, Korea Institute of Oriental Medicine, Daejeon 34054, Republic of Korea","2 NeuroGlymph Imaging and Modulation Center, Korea Institute of Oriental Medicine, Daejeon 34054, Republic of Korea","3 School of Korean Convergence Medical Science, University of Science and Technology (UST), Daejeon, 34113, Republic of Korea"],"abstract":["Ultraviolet (UV) radiation is a major extrinsic factor that contributes to skin aging by inducing oxidative stress, cellular senescence, inflammation, and extracellular matrix degradation. This study investigated the protective effects of Geranium thunbergii (GT) extract against UV-induced skin aging using human dermal fibroblasts (HDFs) and a zebrafish model. Chemical profiling of GT extract by UPLC-PDA and ESI-qTOF-MS identified corilagin, ellagic acid, and kaempferitrin as major constituents. In UV-exposed HDFs, the expression of senescence-related genes, including p16, p21, and p53, was increased, whereas GT treatment at 80 μg/mL attenuated these UV-induced changes. GT treatment also reduced SA-β-gal-positive area and intracellular reactive oxygen species (ROS) levels by approximately 73.0% and 79.7%, respectively, compared with the UV-treated group. In UVB-exposed zebrafish, GT treatment reduced ROS production by approximately 35.6% and 40.4% at 50 and 100 μg/mL, respectively, compared with the UVB-treated group. Consistently, qualitative SA-β-gal staining showed an apparent reduction in senescence-associated β-galactosidase activity, with the most pronounced effect observed at 100 μg/mL. At the molecular level, UVB exposure altered the expression of senescence and photoaging related genes, including p53, MMP2, MMP9, and IL-1β. GT treatment showed a reducing effect on the expression of these genes, particularly at 100 μg/mL. In summary, these findings suggest that G. thunbergii extract exerts protective effects against UV-induced skin aging by suppressing oxidative stress and cellular senescence and by modulating photoaging-related molecular responses in both HDFs and zebrafish. These results support the potential of GT as a natural candidate for the prevention or improvement of UV-induced skin aging."],"keywords":"Geranium thunbergii, Photoaging, Cellular senescence","ack":"","authors":["Ye-Jin Lee","Bongkyun Park","Heung Joo Yuk","Young Sook Kim"],"id":"P-26","type":"poster","session":"포스터","page":55,"printed":53,"has_figure":false,"alias":"한국한의학연구원 한의학연"},{"title":"Screening of Psoriasis-Related Candidate Materials from Vietnamese Medicinal Plants Based on Antioxidant Activity and Total Phenolic Content","affiliations":["Department of Bio-Cosmetic Science, Semyung University, Jecheon, Chungbuk 27136, South Korea"],"abstract":["Psoriasis is a representative chronic inflammatory skin disease, and an imbalance between oxidative stress and the antioxidant defense system has been reported to contribute to its pathogenesis. In addition, reactive oxygen species (ROS) generated by oxidative stress may be associated with inflammatory signaling pathways, including NF-κB, MAPK, and STAT3, thereby contributing to psoriatic inflammatory responses. Accordingly, this study aimed to identify novel materials for psoriasis by establishing antioxidant activity as a primary screening criterion and conducting a stepwise screening process. First, the antioxidant activities of 70 plant species traditionally used for medicinal purposes in Vietnam were evaluated using a DPPH radical scavenging assay, and 10 candidates exhibiting high antioxidant activity were selected as the primary candidate group. Subsequently, the antioxidant activities of the selected 10 candidates were reevaluated using an ABTS radical scavenging assay, and the consistency of the results with those obtained from the DPPH radical scavenging assay was assessed. Finally, based on the results of total phenolic content (TPC) analysis and antioxidant activity, Mezoneuron cucullatum (Vi 41-25) was selected as the final candidate material. Further studies are currently underway using a psoriasis-like cellular model to evaluate the biological activity of Mezoneuron cucullatum (Vi 41-25) and its potential effects on psoriasis."],"keywords":"","ack":"","authors":["Jae Jun Kim","Yeon Woong Jung","Hyung Seo Hwang"],"id":"P-27","type":"poster","session":"포스터","page":56,"printed":54,"has_figure":false,"alias":"세명대학교 세명대"},{"title":"Isolation and Structural Characterization of Khellactone-Type Coumarins from Peucedanum japonicum with Potential Anti-Neuroinflammatory Activity","affiliations":["1 BK21 FOUR KNU Creative BioResearch Group, School of Life Sciences, Kyungpook National University, Daegu 41566, Republic of Korea","2 Research Institute of Pharmaceutical Sciences, College of Pharmacy, Chosun University, Gwangju 61452, Republic of Korea"],"abstract":["This study combined phytochemical characterization, cell-based evaluation, and computational target analysis to investigate the khellactone constituents of Peucedanum japonicum aerial parts and their potential anti-neuroinflammatory activity. Chromatographic separation of the ethyl acetate fraction yielded eighteen khellactone-type dihydropyranocoumarins (1–18). Their structures were established through combined 1D/2D NMR, high-resolution UPLC-QTOF-MSE fragmentation, and electronic circular dichroism (ECD) analysis, which confirmed a common (3′S,4′S) absolute configuration. In cell-based assays, several isolates inhibited lipopolysaccharide-induced nitric oxide production in BV2 microglial cells, with IC₅₀ values of 5.5–6.8 μM, whereas no clear protective effects were observed in HT22 cells.","Candidate molecular targets were further explored using network pharmacology and molecular docking. Among the 72 predicted targets common to the compounds, 50 overlapped with neuroinflammation-associated targets. Subsequent protein-protein interaction analysis identified STAT3, BCL2, HIF1A, GSK3B, PPARA, and MMP9 as six hub genes, with molecular docking predicting a favorable interaction between compound 13 and PPARA. Together, these findings characterize the khellactone constituents of P. japonicum and identify isolates with potential anti-neuroinflammatory activity, while highlighting candidate molecular targets."],"keywords":"Peucedanum japonicum, Khellactones, Network pharmacology, Molecular docking, Anti-neuroinflammatory","ack":"","authors":["Jeong Hyun Park","Woo-Cheol Shin","Jin-Kyu Jang","Hyeon Seon Na","Yong Jae Jeong","Dong-Sung Lee","Dae Young Lee"],"id":"P-28","type":"poster","session":"포스터","page":57,"printed":55,"has_figure":false,"alias":"경북대학교 경북대 조선대학교 조선대"},{"title":"Regional Metabolomic Differentiation of Perilla frutescens Leaves Based on LC-Q-TOF/MS and Multivariate Analysis","affiliations":["a Department of Pharmaceutical Engineering, ABC-RLRC, IALS, Gyeongsang National University, Jinju, 52725, Republic of Korea","b Gyeongnam Aerospace & Defense Institute of Science and Technology, Gyeongsang National University, Jinju 52828, Republic of Korea"],"abstract":["Perilla frutescens Britton var. acuta Kudo leaves are widely consumed in East Asia due to their culinary and medicinal properties, which are largely attributed to their high levels of bioactive metabolites such as rosmarinic acid. In this study, we investigated the variation in rosmarinic acid content and overall metabolite profile of P. frutescens leaves collected from six different provinces in Republic of Korea. Quantitative analysis of the rosmarinic acid content was performed using HPLC, revealing significant regional differences, with the highest concentration observed in the leaves collected in Gyeongsangbuk-do and the lowest concentration in those from Jeollanam-do. HRESIMS and 1H-NMR spectrometry were used to determine the chemical structure of the isolated rosmarinic acid. LC-Q-TOF/MS analysis identified ten major metabolites, including phenolic acids, flavonoids, and triterpenoids. Multivariate statistics (OPLS-DA) revealed distinct clustering of populations, indicating a strong relationship between metabolites and environmental parameters. The distribution of the metabolite fingerprints and rosmarinic acid contents in P. frutescens leaves were also found to differ according to the cultivation region, suggesting that secondary metabolite expression is influenced by environmental and geographic factors. This work shows that metabolome profiles can be used in quality control and the development of high-quality products derived from P. frutescens."],"keywords":"","ack":"","authors":["Na Rae Kang","Yun Gon Son","Seungjae Jang","Seungyu Lee","Jeong Yoon Kim"],"id":"P-29","type":"poster","session":"포스터","page":58,"printed":56,"has_figure":false,"alias":"경상국립대 GADIST 경상국립대학교 경상국립대 경상대"},{"title":"Tyrosinase Inhibitory Activity of Compounds Isolated from Agastache rugosa Seeds as Potential Natural Skin-Whitening Agents","affiliations":["a Department of Pharmaceutical Engineering, ABC-RLRC, IALS, Gyeongsang National University, Jinju, 52725, Republic of Korea"],"abstract":["Agastache rugosa, a member of the Lamiaceae family, is widely used as a food, spice, and medicinal resource in East Asia, including Korea, and has been reported to contain various flavonoids and phenolic compounds, such as acacetin and rosmarinic acid. This study aimed to evaluate the tyrosinase inhibitory activity of compounds isolated from the seeds of Agastache rugosa and to investigate their potential as natural skin-whitening agents. Two compounds were purified from the methanolic crude extract of A. rugosa seeds using silica gel and Sephadex chromatography. All isolated compounds were structurally elucidated based on spectroscopic data, including NMR, UV, and LC-Q-TOF/MS analyses. In the tyrosinase inhibitory assay, compound 1 and compound 2 exhibited IC₅₀ values of 45.44 μM and 59.06 μM, respectively. Both compounds showed competitive inhibition against tyrosinase. These results suggest the potential of A. rugosa seeds as a natural source of skin-whitening agents."],"keywords":"","ack":"","authors":["Seungjae Jang","Seungyu Lee","Hoil Kim","Jeong Yoon Kim"],"id":"P-30","type":"poster","session":"포스터","page":59,"printed":57,"has_figure":false,"alias":"경상국립대학교 경상국립대 경상대"},{"title":"Anti-biofilm Potential of Furanocoumarins Isolated from Peucedanum japonicum Seeds against Pseudomonas aeruginosa","affiliations":["a Department of Pharmaceutical Engineering, ABC-RLRC, IALS, Gyeongsang National University, Jinju, 52725, Republic of Korea"],"abstract":["Pseudomonas aeruginosa is an opportunistic pathogen capable of forming biofilms, which protect bacterial cells from antimicrobial agents and host immune responses, thereby increasing antimicrobial resistance and complicating the treatment of infections. The emergence of multidrug-resistant strains has led to increasing efforts to identify novel biofilm-control agents from natural products and their derivatives. Peucedanum japonicum is an edible and medicinal plant rich in coumarin and furanocoumarin derivatives; however, the anti-biofilm activities of individual compounds isolated from its seeds have not been sufficiently investigated. In this study, oxypeucedanin (1) and isoimperatorin (2) were isolated from P. japonicum seeds, and their structures were identified using HRESIMS and NMR analyses. Fluorescence microscopy of P. aeruginosa biofilms treated with the two compounds revealed reduced bacterial aggregation and alterations in biofilm architecture. In addition, molecular docking analysis targeting LasR, a quorum-sensing regulatory protein, was performed to investigate potential molecular interactions with the quorum-sensing system. These findings demonstrate the anti-biofilm potential of oxypeucedanin and isoimperatorin isolated from P. japonicum seeds and support their further investigation as natural-product-based candidates for controlling P. aeruginosa biofilms."],"keywords":"","ack":"","authors":["Jihyeon Choi","Hoil Kim","Jeong Yoon Kim"],"id":"P-31","type":"poster","session":"포스터","page":60,"printed":58,"has_figure":false,"alias":"경상국립대학교 경상국립대 경상대"},{"title":"Tyrosinase Inhibition and Kinetic Characterization of Tracheloside and Arctiin from Synurus deltoides Seeds","affiliations":["a Department of Pharmaceutical Engineering, ABC-RLRC, IALS, Gyeongsang National University, Jinju, 52725, Republic of Korea"],"abstract":["Synurus deltoides, a perennial herb belonging to the Asteraceae family, has traditionally been used as an edible and medicinal resource. However, studies on the bioactivity and metabolites of its seeds remain limited. In this study, major compounds were isolated from S. deltoides seeds, and their tyrosinase inhibitory activity and skin-whitening effects were evaluated. The methanolic extract was suspended in water and successively partitioned with n-hexane and ethyl acetate. The major compounds were isolated and purified through MPLC. The isolated compounds were identified as tracheloside (SD1) and arctiin (SD2) by HPLC and LC-Q-TOF/MS analyses. In the tyrosinase inhibitory assay, tracheloside (SD1) and arctiin (SD2) exhibited IC₅₀ values of 18.36 μM and 12.88 μM, respectively. Enzyme kinetic analysis revealed that tracheloside showed competitive inhibition, whereas arctiin exhibited mixed-type inhibition. These findings suggest that tracheloside and arctiin derived from S. deltoides seeds possess potent tyrosinase inhibitory activity and may serve as promising natural skin-whitening agents and functional cosmetic ingredients."],"keywords":"","ack":"","authors":["Bashir Shanza","Seungmin Oh","Juhyeon Kim","Jeong Yoon Kim"],"id":"P-32","type":"poster","session":"포스터","page":61,"printed":59,"has_figure":false,"alias":"경상국립대학교 경상국립대 경상대"}],"program":{"event":{"name":"2026 한국응용생명화학회 천연물분과 심포지엄","theme":"천연물 연구성과의 산업화 전략","date":"2026. 10. 15.(목) – 16.(금)","venue":"한국생명공학연구원 오창분원 국제회의동","address":"충북 청주시 청원구 오창읍 연구단지로 30, 한국생명공학연구원 오창분원 국제회의동","host":"한국응용생명화학회 천연물분과","oral_room":"국제회의동","poster":"로비 (10.15 14:30–15:30 / 10.16 09:00–10:00)","transit_url":"https://portal.kribb.re.kr/board?menuId=MENU00923&siteId=null","summary":"기술강연 3편 · 초청강연 5편 · 학생 구두발표 4편 · 포스터 32편"},"days":[{"label":"DAY 1","date":"10. 15.(목)","rows":[{"time":"09:30–11:50","kind":"기술강연","ids":["T-1","T-2","T-3"]},{"time":"12:00–13:15","kind":"점심","text":"점심 (미제공)"},{"time":"13:15–13:30","kind":"개회","text":"개회 및 축사, 단체 사진"},{"time":"13:30–14:30","kind":"초청강연 Ⅰ · 연구성과의 IP 확보","ids":["I-1","I-2"]},{"time":"14:30–15:30","kind":"포스터","text":"포스터 전시 (로비)","poster":true},{"time":"15:30–17:00","kind":"초청강연 Ⅱ · 연구성과의 산업화","ids":["I-3","I-4","I-5"]},{"time":"17:00–17:30","kind":"총회","text":"천연물 분과 총회"},{"time":"18:00–20:00","kind":"네트워킹","text":"만찬, 네트워킹 (장소 TBA)"}]},{"label":"DAY 2","date":"10. 16.(금)","rows":[{"time":"09:00–10:00","kind":"포스터","text":"포스터 전시 (로비)","poster":true},{"time":"10:00–11:00","kind":"학생 구두발표","ids":["S-1","S-2","S-3","S-4"]},{"time":"11:00–11:30","kind":"폐회","text":"시상 및 폐회"}]}],"note":"장소 표기가 없는 프로그램은 국제회의동에서 진행됩니다. 세부 프로그램은 변경될 수 있습니다.","greeting":["바쁘신 가운데 참석해 주신 천연물 분야 산·학·연·관 관계자 여러분, 반갑습니다.","한국응용생명화학회 천연물분과 회장을 맡고 있는 이종석입니다.","먼저 천연물분과 심포지엄에 참석해 주신 모든 분들께 진심으로 감사드립니다. 아울러 귀한 강연을 준비해 주신 연사님들과 행사 준비를 위해 애써주신 학회와 분과 운영위원분들께도 깊이 감사드립니다.","지난해에는 충청지회와 공동으로 천연물 소재의 산업화 기술에 대한 심포지엄을 개최했으며, 올해는 천연물분과 단독으로 행사를 마련하게 되었습니다. 특히, 올해는 우리 천연물 연구자들이 함께 고민해야 할 중요한 질문을 중심으로 프로그램을 구성했습니다.","바로 우리가 연구해 온 천연물 연구성과는 얼마나 산업으로 연결되고 있는가? 라는 질문입니다.","우리나라에는 우수한 천연물 연구자와 축적된 연구성과, 그리고 다양한 소재와 기술이 있습니다.","그럼에도 불구하고 연구성과가 실제 기업의 제품과 매출, 새로운 산업적 가치로 이어지는 사례는 아직 충분하지 않다는 아쉬움이 있습니다.","연구성과가 산업으로 연결되기까지는 특허와 지식재산권, 원료의 표준화와 품질관리, 인허가, 기술이전, 생산공정과 사업성 등 넘어야 할 과제가 많기 때문입니다.","그래서 저는 여러분께 한 가지 화두를 던지고 싶습니다.","천연물 연구의 산업화는 연구가 끝난 다음에 고민해야 하는 것일까요?","저는 연구를 시작하는 단계에서부터 산업화를 함께 생각할 필요가 있다고 봅니다.","어떤 소재를 연구할 것인지 결정하는 단계에서부터 이 소재가 어느 산업에서 활용될 수 있는지, 기업이 필요로 하는 데이터는 무엇인지, 그리고 연구성과를 실제 제품과 기술로 발전시키기 위해 무엇을 준비해야 하는지 고민하자는 것입니다.","물론 모든 연구가 처음부터 산업화를 목표로 해야 한다는 의미는 아닙니다. 기초연구와 새로운 과학적 발견 역시 매우 중요합니다. 다만 연구 초기부터 산업적 활용 가능성을 함께 살펴본다면, 우리가 만들어내는 연구성과의 가치와 활용 범위를 더욱 넓힐 수 있을 것입니다.","이러한 문제의식을 담아 올해 심포지엄의 주제를 「천연물 연구성과의 산업화 전략」으로 정했습니다.","오늘 심포지엄은 크게 기술강연과 초청강연으로 구성했습니다.","기술강연에서는 최신 연구동향과 천연물 분석기술, LC-HRMS 분석 워크플로 등 연구현장에서 실제로 활용할 수 있는 기술적 내용을 준비하였습니다. 초청강연에서는 특허와 IP 확보 전략, 용도별 실험 데이터, 식품산업화와 시장진입 전략, 기술이전 및 사업화 사례, 그리고 Scale-up 전략까지 연구성과의 산업화 과정 전반을 각 분야 최고 전문가들과 함께 살펴보고자 합니다.","이 자리가 단순히 새로운 연구결과를 공유하는 데 그치지 않고, 나의 연구가 산업에서 활용되려면 무엇이 더 필요할까? 라는 질문을 각자의 연구에 적용해 보는 기회가 되기를 바랍니다.","또한 연구자와 기업, 기술이전 전문가 등 다양한 분야의 관계자들이 서로의 관점과 수요를 이해하고 새로운 협력의 기회를 만드는 자리가 되었으면 합니다.","천연물 연구의 미래는 우수한 연구성과를 만들어내는 데서 한 걸음 더 나아가, 그 성과를 산업과 사회의 가치로 연결할 때 더욱 큰 가능성을 열 수 있다고 생각합니다.","끝으로 참석해 주신 모든 분들께 다시 한번 감사드리며, 오늘 심포지엄이 우리 천연물 연구의 새로운 도약과 산업화의 가능성을 여는 뜻깊은 자리가 되기를 기원합니다.","감사합니다.","2026년 10월","한국응용생명화학회 천연물분과 회장 이 종 석"]}};

    var top = '<span class="id">' + esc(e.id) + '</span>';
    if(e.type==='poster') top += '<span class="tag">포스터</span><span>' + esc(e.printed) + '쪽</span>';
    else top += '<span class="tag">' + esc(e.session.split(' · ')[0]) + '</span><span>' + esc(e.day + ' ' + e.time) + '</span>';
    var body = '';
    if(e.program_title && e.program_title !== e.title) body += '<h4>프로그램 제목</h4><div>' + hl(e.program_title, ts) + '</div>';
    body += '<h4>저자</h4><div class="auth">' + hl((e.authors||[]).join(', '), ts) + '</div>';
    if(e.affiliations && e.affiliations.length) body += '<ul class="aff">' + e.affiliations.map(function(a){ return '<li>' + hl(a, ts) + '</li>'; }).join('') + '</ul>';
    if(e.bio){
      body += '<h4>연사 소개</h4><div class="bio"><div><b>' + esc(e.speaker) + '</b> · ' + esc(e.bio.position) + '</div>' +
        e.bio.sections.map(function(s){ return '<div><b>' + esc(s.h) + '</b> ' + hl(s.text, ts) + '</div>'; }).join('') + '</div>';
    }
    body += '<h4>초록</h4><div class="abs">' + (e.abstract||[]).map(function(p){ return '<p>' + hl(p, ts) + '</p>'; }).join('') + '</div>';
    if(e.keywords){
      body += '<h4>키워드</h4><div class="kws">' + e.keywords.split(/[,;]\s*/).filter(Boolean).map(function(k){
        return '<button class="kw" data-kw="' + esc(k.trim()) + '">' + hl(k.trim(), ts) + '</button>'; }).join('') + '</div>';
    }
    if(e.ack) body += '<h4>사사</h4><div class="aff">' + hl(e.ack, ts) + '</div>';
    body += '<div class="acts"><button class="act" data-page="' + e.page + '" data-printed="' + e.printed + '">' + IC.page + '원본 쪽 보기' + (e.has_figure ? ' (그림 포함)' : '') + '</button>' +
      '<button class="act" data-share="' + esc(e.id) + '">' + IC.link + '링크 복사</button></div>';
    return '<article id="' + esc(e.id) + '"><div class="hd" role="button" tabindex="0" aria-expanded="false"><div class="top">' + top +
      '<span class="star" role="button" tabindex="0" aria-label="담아두기" aria-pressed="' + fav + '" data-fav="' + esc(e.id) + '">' + IC.star + '</span></div>' +
      '<div class="ttl">' + hl(e.title, ts) + '</div><div class="who">' + hl(e._who, ts) + '</div></div><div class="bd">' + body + '</div></article>';
  }

  function render(){
    chips.querySelectorAll('.chip').forEach(function(c){ c.setAttribute('aria-pressed', c.dataset.g===state.g); });
    var ts = terms(state.q);
    var list = E.filter(function(e){
      if(state.g==='fav' && !favs[e.id]) return false;
      if(state.g!=='all' && state.g!=='fav' && e._g!==state.g) return false;
      return ts.every(function(t){ return e._idx.indexOf(t) > -1; });
    });
    $('#home').style.display = (!ts.length && state.g==='all') ? '' : 'none';
    $('#clr').style.display = state.q ? 'block' : 'none';
    var nf = Object.keys(favs).length;
    chips.querySelector('[data-g="fav"]').textContent = '담아둔 초록' + (nf ? ' ' + nf : '');
    $('#cnt').textContent = (ts.length ? '“' + state.q + '” ' : '') + list.length + '편';
    var h = '', last = '';
    if(!list.length){
      h = '<div class="empty">' + (state.g==='fav' ? '담아둔 초록이 없습니다. 카드의 별을 눌러 담아 두세요.' : '찾는 초록이 없습니다. 다른 낱말로 검색해 보세요.') + '</div>';
    }
    list.forEach(function(e){
      if(e._g !== last && !ts.length){ h += '<div class="grp">' + esc(SECT[e._g]) + '</div>'; last = e._g; }
      h += card(e, ts);
    });
    $('#list').innerHTML = h;
    if(ts.length && list.length <= 3) $('#list').querySelectorAll('article').forEach(function(a){ toggle(a, true); });
  }

  function toggle(a, on){
    on = on===undefined ? !a.classList.contains('open') : on;
    a.classList.toggle('open', on);
    a.querySelector('.hd').setAttribute('aria-expanded', on);
  }

  function toast(t){ var el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove('on'); }, 1600); }
  function copy(t){
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(function(){ toast('링크를 복사했습니다'); }, function(){ prompt('링크', t); }); }
    else prompt('링크', t);
  }

  $('#list').addEventListener('click', function(ev){
    var f = ev.target.closest('[data-fav]');
    if(f){ ev.stopPropagation(); var id = f.dataset.fav;
      if(favs[id]) delete favs[id]; else favs[id] = 1;
      store('np26fav', JSON.stringify(favs));
      f.setAttribute('aria-pressed', !!favs[id]);
      toast(favs[id] ? id + ' 담아 두었습니다' : id + ' 담기를 해제했습니다');
      var nf = Object.keys(favs).length; chips.querySelector('[data-g="fav"]').textContent = '담아둔 초록' + (nf ? ' ' + nf : '');
      return; }
    var k = ev.target.closest('[data-kw]');
    if(k){ $('#q').value = state.q = k.dataset.kw; state.g = 'all'; render(); window.scrollTo(0, 0); return; }
    var pg = ev.target.closest('[data-page]');
    if(pg){ openPage(+pg.dataset.page, pg.dataset.printed); return; }
    var sh = ev.target.closest('[data-share]');
    if(sh){ copy(location.href.split('#')[0] + '#' + sh.dataset.share); return; }
    var hd = ev.target.closest('.hd');
    if(hd){ toggle(hd.parentNode); }
  });
  $('#list').addEventListener('keydown', function(ev){
    if(ev.key!=='Enter' && ev.key!==' ') return;
    var f = ev.target.closest('[data-fav]'); if(f){ ev.preventDefault(); f.click(); return; }
    if(ev.target.classList.contains('hd')){ ev.preventDefault(); toggle(ev.target.parentNode); }
  });

  function openPage(n, printed){
    var pad = n < 10 ? '0' + n : '' + n;
    $('#lbi').src = '../pages/p-' + pad + '.jpg';
    $('#lbi').alt = '원본 ' + printed + '쪽';
    $('#lbt').textContent = '원본 ' + printed + '쪽 (PDF ' + n + '쪽)';
    $('#lb').classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function closePage(){ $('#lb').classList.remove('on'); document.body.style.overflow = ''; }
  $('#lbx').onclick = closePage;
  $('#lb').addEventListener('click', function(ev){ if(ev.target.id==='lb') closePage(); });
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape') closePage(); });

  /* 검색 입력 */
  var tmr;
  $('#q').addEventListener('input', function(){ clearTimeout(tmr); var v = this.value; tmr = setTimeout(function(){ state.q = v.trim(); render(); }, 120); });
  $('#clr').onclick = function(){ $('#q').value = ''; state.q = ''; render(); $('#q').focus(); };

  /* 글자 크기·다크 */
  var FS = [14, 16, 18, 20], fi = +(store('np26fs') || 1); if(!(fi >= 0 && fi < FS.length)) fi = 1;
  function applyFs(){ document.documentElement.style.setProperty('--fs', FS[fi] + 'px'); store('np26fs', fi); }
  $('#fsm').onclick = function(){ if(fi > 0){ fi--; applyFs(); } };
  $('#fsp').onclick = function(){ if(fi < FS.length - 1){ fi++; applyFs(); } };
  applyFs();
  function isDark(){ var t = document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function applyTheme(t){ if(t) document.documentElement.dataset.theme = t; $('#theme').textContent = isDark() ? '라이트' : '다크'; }
  applyTheme(store('np26theme'));
  $('#theme').onclick = function(){ var t = isDark() ? 'light' : 'dark'; store('np26theme', t); applyTheme(t); };
  $('#openall').onclick = function(){
    var arts = $('#list').querySelectorAll('article'), any = false;
    arts.forEach(function(a){ if(!a.classList.contains('open')) any = true; });
    arts.forEach(function(a){ toggle(a, any); });
    this.textContent = any ? '모두 접기' : '모두 펼치기';
  };

  /* 맨 위로 */
  window.addEventListener('scroll', function(){ $('#topb').classList.toggle('on', window.scrollY > 600); }, {passive:true});
  $('#topb').onclick = function(){ window.scrollTo({top:0, behavior:'smooth'}); };

  /* 주소의 #P-01 등으로 바로 열기 */
  function goHash(){
    var id = decodeURIComponent(location.hash.slice(1));
    if(!byId[id]) return;
    if(state.q || (state.g!=='all' && state.g!==byId[id]._g)){ state.q = ''; $('#q').value = ''; state.g = 'all'; render(); }
    var a = document.getElementById(id);
    if(a){ toggle(a, true); requestAnimationFrame(function(){ setTimeout(function(){ a.scrollIntoView({block:'start'}); }, 60); }); }
  }
  window.addEventListener('hashchange', goHash);

  home(); render(); goHash();
})();
</script>
</body>
</html>
